<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>theID Tutorial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card" id="card" aria-live="polite">
    <svg id="art" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="copy">
      <span class="num" id="num">01</span>
      <h1 class="title" id="title">This is where it begins.</h1>
      <p class="text" id="text"></p>
    </div>
  </article>
  <div class="nav">
    <button type="button" id="prev">← Back</button>
    <button type="button" id="next">Begin →</button>
  </div>
  <div class="track" id="track" aria-label="The story so far"></div>
</main>
<script src="app.js"></script>
</body>
</html>
