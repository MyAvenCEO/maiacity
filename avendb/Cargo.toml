# avenDB: the user-owned, end-to-end encrypted database, its own workspace beside the media vault (vault/), so the two
# never build together: its crates pick their own versions and features, iroh's among them, and nothing here can
# change what the media vault runs. See README.md.
[workspace]
resolver = "3"
members = [
    "crates/avendb",
    "crates/avendb-browser",
    "crates/avendb-device",
    "crates/avendb-net",
    "crates/avendb-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde_json = "1"

# Debug builds: line tables for our code (backtraces keep their lines), none for the dependencies; everything
# optimised, as the property tests replay thousands of histories, each through every rule and the key schedule.
[profile.dev]
debug = "line-tables-only"
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# Classic McEliece makes a key pair in about 0.6 s at opt-level 3 and twice that at 2, and the tests make many
[profile.dev.package.classic-mceliece-rust]
opt-level = 3

# Release builds are the tile's WebAssembly (scripts/build-web.sh): one codegen unit, optimised across crates.
[profile.release]
codegen-units = 1
lto = true

# The Mac app's native device (avendb-device, built by vault/app/build.rs as the app's sidecar): optimised as a
# release, but in parallel codegen units, without LTO and incrementally, so the app's build doesn't wait long on it
[profile.app]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
