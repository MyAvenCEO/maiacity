# avenDB's server on this machine (P8b): docker compose -f avendb/compose.yml up --build
# Its device's secret and its store stay in the avendbdata volume. Not the deployment: that is the service avendb in the
# root compose files, rolled out by .github/workflows/api.yml and avendb.yml (README.md, "Deploying the server").
services:
  avendb:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: ${AVENDB_IMAGE:-avendb-server:local}
    container_name: avendb-server
    restart: unless-stopped
    environment:
      # where devices reach the relay: on this machine, its port; once deployed, its own host name behind Caddy
      AVENDB_RELAY_URL: ${AVENDB_RELAY_URL:-http://localhost:3350}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - avendbdata:/data
    ports:
      - "7401:7401/udp"
      - "3350:3350"

volumes:
  avendbdata:
