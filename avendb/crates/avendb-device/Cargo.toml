[package]
name = "avendb-device"
version = "0.1.0"
description = "avenDB's device in the Mac app, maiaCITY Studio: the browser's device run natively beside the app, its node on UDP sockets of its own and its store in a folder on disk, which the app's page talks to in lines of JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built by vault/app/build.rs into the app as its sidecar, in avenDB's own workspace and versions: avendb-net alone,
# so its TLS is aws-lc-rs with X25519MLKEM768 only (`avendb_net::pq_provider`), never ring
[dependencies]
avendb = { path = "../avendb" }
avendb-net = { path = "../avendb-net" }
avendb-browser = { path = "../avendb-browser" }
anyhow = "1"
# the page's bytes in base64, the sheet's in base64url
data-encoding = "2.11"
getrandom = "0.4"
# the relay's URL
iroh = { version = "=1.3.0", default-features = false }
# the device's code as a QR code, for the next device's camera
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json.workspace = true
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tracing = "0.1"
# its log on stderr, which the app takes into its own
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"

[dev-dependencies]
avendb-server = { path = "../avendb-server" }
