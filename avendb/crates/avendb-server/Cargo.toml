[package]
name = "avendb-server"
version = "0.1.0"
description = "avenDB's server: its node in a folder of its own, holding only ciphertext, and its relay, which lets in only the devices the server knows"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A crate of its own, as iroh-relay's server brings ring in beside aws-lc-rs: a device's build, of avendb-net alone,
# never has it, and the server installs avenDB's TLS (`pq_provider`, X25519MLKEM768 only) as its process default.
[dependencies]
avendb = { path = "../avendb" }
avendb-net = { path = "../avendb-net" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "tls-aws-lc-rs"] }
rustls = { version = "0.23.33", default-features = false, features = ["aws_lc_rs", "std"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# its bucket (blobs B3a): S3 requests signed by rusty-s3 and sent by reqwest, over TLS of avenDB's own making
# (`bucket::tls`); Content-MD5 on every upload, as a bucket with Object Lock asks for it
rusty-s3 = { version = "0.10.2", default-features = false, features = ["aws-lc-rs", "full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "1.0.9"
md-5 = "0.11"
data-encoding = "2.11"
zeroize = "1.8"
