[package]
name = "avendb-browser"
version = "0.1.0"
description = "avenDB's device in a web page: a device of its person on avenDB's network, as WebAssembly, which links through the code another device shows with its person's passkey and syncs through the server's relay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# a cdylib for the page (built by scripts/test-browser.sh), an rlib for the tests, which run natively and in Chromium
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
avendb = { path = "../avendb" }
avendb-net = { path = "../avendb-net" }
anyhow = "1"
getrandom = "0.4"
# the relay's URL; its TLS and features are avendb-net's, for a machine and for a browser
iroh = { version = "=1.3.0", default-features = false }
n0-future = "0.3.2"
# the device's code as a QR code, for the next device's camera
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# the world a device shows, as the page reads it
serde_json.workspace = true
# a closed device's page stops waiting for its changes
tokio = { version = "1.44", default-features = false, features = ["sync"] }
zeroize = "1.8"
# pinned to the wasm-bindgen CLI that writes the page's package, as avendb-web's
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"

# in a page, the libraries that may draw randomness draw it from the browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# passkeys of the relying party localhost count (avendb's `localhost-passkeys`): the test page's, made by Chromium's
# virtual authenticator (scripts/test-browser.sh), never in a build that ships
localhost-passkeys = ["avendb/localhost-passkeys"]

[dev-dependencies]
avendb-server = { path = "../avendb-server" }
libc = "0.2"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
