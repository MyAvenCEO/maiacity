[package]
name = "avendb-web"
version = "0.1.0"
description = "avenDB in a web page: the Lab as WebAssembly for the avenDB tile, its world made a step at a time, read through JSON views and changed through JSON actions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# a cdylib for the page (built by scripts/build-web.sh), an rlib for the tests, which run natively
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
avendb = { path = "../avendb" }
serde_json.workspace = true
# pinned to the wasm-bindgen CLI that writes the page's package
wasm-bindgen = "=0.2.129"

# in a page, the libraries that may draw randomness draw it from the browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
