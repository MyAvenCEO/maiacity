# The signup service, locally: `docker compose up -d --build`
#   api – Bun: passkey signup, session, profile, founder count
#   db  – Postgres 17, data in the `pgdata` volume
# Values come from .env (see .env.example). The journal itself is not in here:
# it stays a static site on the CDN and only calls this from the browser.
name: maia-city

services:
  db:
    image: postgres:17-alpine
    container_name: maia-city-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maiacity}
      POSTGRES_USER: ${POSTGRES_USER:-maiacity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maiacity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Useful locally (psql, running the api outside Docker); the prod file closes it.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maiacity} -d ${POSTGRES_DB:-maiacity}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-maia-city-api:local}
    container_name: maia-city-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgres://${POSTGRES_USER:-maiacity}:${POSTGRES_PASSWORD:-maiacity}@db:5432/${POSTGRES_DB:-maiacity}
      # The relying party is the SITE, not this API — a passkey created on
      # maia.city stays valid across its subdomains.
      RP_ID: ${RP_ID:-localhost}
      RP_NAME: ${RP_NAME:-maiaCITY}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # speech to text (api/src/stt.ts): Prem's key, from the GitHub secret PREMAI_API_KEY; without it /api/transcripts
      # answers 503 and the vault server waits. The client KEK is made once and kept in the database.
      PREMAI_API_KEY: ${PREMAI_API_KEY:-}
    ports:
      - "${API_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # The media vault's peer (vault/crates/vault-server): catalog replica, every file in Object Storage, the iroh relay
  # and the HTTP gateway.
  vault:
    build:
      context: .
      dockerfile: vault/Dockerfile.server
    image: ${VAULT_IMAGE:-maia-city-vault:local}
    container_name: maia-city-vault
    restart: unless-stopped
    # only with COMPOSE_PROFILES=vault (set on the server): locally the rest runs without S3 values
    profiles: ["vault"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-maiacity}:${POSTGRES_PASSWORD:-maiacity}@db:5432/${POSTGRES_DB:-maiacity}
      API_URL: http://api:3000
      VAULT_PUBLIC_IP: ${VAULT_PUBLIC_IP:-}
      VAULT_RELAY_URL: ${VAULT_RELAY_URL:-https://api.maia.city}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://hel1.your-objectstorage.com}
      S3_REGION: ${S3_REGION:-hel1}
      S3_BUCKET: ${S3_BUCKET:-maiacity}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - vaultdata:/data
    ports:
      - "7400:7400/udp"

volumes:
  pgdata:
  vaultdata:
