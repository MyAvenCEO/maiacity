name: One image, built once
description: >-
  Builds one of the images a release ships (the peer's or the API's) from this run's files, pushes it by digest under a
  ci- tag a release never reads, and names that digest in the artifact image-<component>, where release.yml promotes it.

# ci.yml's image jobs, one per image, so each starts as soon as what it is built from is there: the peer's at once, the
# API's once the page's device is (aven/api/Dockerfile carries it). A fork's pull request builds without pushing.
inputs:
  component:
    description: avendb (the peer) or api
    required: true
  dockerfile:
    description: The image's Dockerfile
    required: true
  push:
    description: Whether to push it ('true' on this repository's branches)
    required: true

runs:
  using: composite
  steps:
    # an image's name is lower case, the repository's (MyAvenCEO) is not
    - id: name
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4.4.1
    - if: inputs.push == 'true'
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: build
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.name.outputs.image }}:ci-${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.component }}
        cache-to: type=gha,scope=${{ inputs.component }},mode=max
    # the image's name and digest, as release.yml reads them
    - if: inputs.push == 'true'
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        IMAGE: ${{ steps.name.outputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the $COMPONENT build named no digest"; exit 1; }
        jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg sha "$GITHUB_SHA" '{image:$image,digest:$digest,sha:$sha}' > "image-$COMPONENT.json"
        cat "image-$COMPONENT.json"
    - if: inputs.push == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: image-${{ inputs.component }}
        path: image-${{ inputs.component }}.json
        retention-days: 7
