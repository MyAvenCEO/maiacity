# What the three bun lockfiles carry (the dependency census, 2026-10-26): `bun audit` on the site and app (root), the API
# and the infrastructure, against GitHub's advisory database. A moderate or worse advisory fails the job; low ones are
# printed. Once a day too, as advisories appear without any change of ours. The Rust lockfiles have their own gate
# (cargo-deny, avendb-assurance.yml).
#
# Held back, by advisory: vite 8.3.0's dev-server advisories (the dev server alone, never a build). Vite 8.3.3 brings a
# newer rolldown, which bundles every asset recipe to other bytes, so each recipe's hash leaves ./cards.json and the
# vault's pins: that upgrade goes with new recipe cards, by AIP, not here.
#
# This is a public repository: the job prints package names and advisories only.
name: bun dependencies (audit)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['bun.lock', 'package.json', 'api/bun.lock', 'api/package.json', 'infra/bun.lock', 'infra/package.json', '.github/workflows/bun-audit.yml']
  push:
    branches: [main]
    paths: ['bun.lock', 'api/bun.lock', 'infra/bun.lock']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
# a pull request's new push replaces its run
concurrency:
  group: bun-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: '.'
            ignore: --ignore=GHSA-9jrq-w75r-8gcw --ignore=GHSA-rq7h-c2jc-7f22 --ignore=GHSA-698v-4r3x-3vcv --ignore=GHSA-r825-w8mm-5pxw --ignore=GHSA-587h-7wmj-h5pm --ignore=GHSA-vfpm-58rq-9qcg
          - dir: api
          - dir: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ${{ matrix.dir }}
      - name: Every advisory, for the log
        run: bun audit || true
        working-directory: ${{ matrix.dir }}
      - name: None moderate or worse
        run: bun audit --audit-level=moderate ${{ matrix.ignore }}
        working-directory: ${{ matrix.dir }}
