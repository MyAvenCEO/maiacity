# What the three bun lockfiles carry (the dependency census, 2026-10-26): `bun audit` on the site and app (root), the API
# and the infrastructure, against GitHub's advisory database. A moderate or worse advisory fails the job; low ones are
# printed. Once a day too, as advisories appear without any change of ours. The Rust lockfiles have their own gate
# (cargo-deny, avendb-assurance.yml).
#
# This is a public repository: the job prints package names and advisories only.
name: bun dependencies (audit)
on:
  pull_request:
    paths: ['bun.lock', 'package.json', 'api/bun.lock', 'api/package.json', 'infra/bun.lock', 'infra/package.json', '.github/workflows/bun-audit.yml']
  push:
    branches: [main]
    paths: ['bun.lock', 'api/bun.lock', 'infra/bun.lock']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', api, infra]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ${{ matrix.dir }}
      - name: Every advisory, for the log
        run: bun audit || true
        working-directory: ${{ matrix.dir }}
      - name: None moderate or worse
        run: bun audit --audit-level=moderate
        working-directory: ${{ matrix.dir }}
