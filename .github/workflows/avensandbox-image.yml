# avenSANDBOX's image, owned by theOS (theOS/aip/AIP-2.json): every tool theOS's checks are built and run with
# (theOS/sandbox/box/Dockerfile). Built for amd64 (cloud sessions, runners) and arm64 (OrbStack on Apple Silicon), each
# on a runner of its own kind, and joined into one image. Tagged theos-<hash of theOS/sandbox/box and this file>, so the
# same inputs never build twice and every checkout runs exactly its own box; main's build is also "latest". Then a smoke
# step proves every tool works inside it. Public, so it pulls without a token.
name: avenSANDBOX image

on:
  push:
    paths:
      - theOS/sandbox/box/**
      - .github/workflows/avensandbox-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: avensandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.box.outputs.name }}
      image: ${{ steps.box.outputs.image }}
      complete: ${{ steps.built.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The box's tag
        id: box
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/sandbox"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tag="theos-$(printf '%s %s' "$(git rev-parse HEAD:theOS/sandbox/box)" "$(git rev-parse HEAD:.github/workflows/avensandbox-image.yml)" | sha256sum | cut -c1-16)"
          echo "image=$name:$tag" >> "$GITHUB_OUTPUT"
          echo "avenSANDBOX's tag: $tag (theOS/sandbox/box and this workflow)"
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Built for both platforms already?
        id: built
        env:
          IMAGE: ${{ steps.box.outputs.image }}
        run: |
          has=$(docker buildx imagetools inspect --raw "$IMAGE" 2>/dev/null \
            | jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | join(",")' || true)
          echo "$IMAGE has: ${has:-nothing yet}"
          if [ "$has" = "amd64,arm64" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.complete != 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          # theOS/sandbox/box alone: the image holds tools, never our code
          context: theOS/sandbox/box
          file: theOS/sandbox/box/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=avenSANDBOX: the tools theOS is built and checked with
          outputs: type=image,name=${{ needs.plan.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # The layers' cache lives in the registry beside the image, per platform
          cache-from: type=registry,ref=${{ needs.plan.outputs.name }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.plan.outputs.name }}:cache-${{ matrix.arch }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    name: One image for both platforms
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the platforms under the box's tag
        working-directory: digests
        env:
          NAME: ${{ needs.plan.outputs.name }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker buildx imagetools create --tag "$IMAGE" $(printf "$NAME@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE"

  smoke:
    name: Every tool works inside it
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Each tool answers, wasm32 is installed, Chromium launches
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker run --rm "$IMAGE" bash -euc '
            rustc --version; cargo --version; cargo clippy --version; rustfmt --version
            rustup target list --installed | grep -x wasm32-unknown-unknown
            wasm-bindgen --version; bun --version; node --version; lean --version; lake --version
            versitygw --help > /dev/null && echo "versitygw ok"
            clang --version | head -n 1; llvm-ar --version | head -n 1
            cargo "+$AVEN_NIGHTLY" --version; cargo fuzz --version
            cd /tmp && npm install --no-save --silent playwright@1.64.1 > /dev/null
            node -e "require(\"playwright\").chromium.launch().then(async (b) => { console.log(\"chromium\", b.version()); await b.close(); })"
          '

  latest:
    name: main's box is latest
    needs: [plan, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag it latest
        env:
          NAME: ${{ needs.plan.outputs.name }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: docker buildx imagetools create --tag "$NAME:latest" "$IMAGE"
