name: Delivery close checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/api.yml'
      - '.github/workflows/avendb.yml'
      - '.github/workflows/delivery-checks.yml'
      - 'deploy/stop-avendb.py'
      - 'deploy/test_stop_avendb*.py'
      - 'docker-compose*.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# a pull request's new push replaces its run
concurrency:
  group: delivery-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  close:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Owned graceful close and activation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s deploy -p 'test_stop_avendb.py' -v
      - name: Actual disposable Docker close and cancellation
        env:
          AVENDB_DISPOSABLE_DOCKER: '1'
        run: python3 deploy/test_stop_avendb_docker.py -v
