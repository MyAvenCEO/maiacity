name: Delivery close checks

on:
  pull_request:
    paths:
      - '.github/workflows/api.yml'
      - '.github/workflows/avendb.yml'
      - '.github/workflows/delivery-checks.yml'
      - 'deploy/stop-avendb.py'
      - 'deploy/test_stop_avendb*.py'
      - 'docker-compose*.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    name: Owned graceful close and activation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s deploy -p 'test_stop_avendb.py' -v
      - name: Actual disposable Docker close and cancellation
        env:
          AVENDB_DISPOSABLE_DOCKER: '1'
        run: python3 deploy/test_stop_avendb_docker.py -v
