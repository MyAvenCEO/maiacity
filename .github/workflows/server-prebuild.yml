name: avenDB server image, built ahead

# The avenDB server's image for a pull request's avendb/ files, built while its checks run, so main's release
# (main.yml, image.yml) promotes it in seconds instead of building it again after the merge (5-9 min).
#
# Trust: this file runs as main has it (pull_request_target), never as a pull request has it. The pull request's files
# run only inside the Docker build, in a job that holds no token, no secret and no cache it could write: it hands the
# image out as a file. The next job, which runs none of the pull request's files, pushes that file as
# `tree-<git tree of avendb/>` and signs where it came from (artifact attestation). main promotes such an image only for
# its own avendb/ tree and only with that signature, from this workflow on refs/heads/main: an image any other workflow
# pushed under the same tag, a pull request's own workflow among them, is never promoted.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'avendb/**'

permissions: {}

concurrency:
  group: server-prebuild-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  key:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      built: ${{ steps.tree.outputs.built }}
    steps:
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          IMAGE: ghcr.io/${{ github.repository }}-avendb
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD" --jq '.tree[] | select(.path == "avendb" and .type == "tree") | .sha')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no avendb/ tree at $HEAD"; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${IMAGE,,}:tree-$tree" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"; echo "tree-$tree is already there"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

  # the pull request's files, and nothing that could carry them further: no token, no secrets, no cache written
  build:
    needs: key
    if: needs.key.outputs.built != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: The checked-out avendb/ is the one the key names
        env:
          TREE: ${{ needs.key.outputs.tree }}
        run: test "$(git rev-parse HEAD:avendb)" = "$TREE"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: avendb
          file: avendb/Dockerfile.server
          push: false
          tags: avendb-server:prebuilt
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: avendb-server-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0

  push:
    needs: [key, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: avendb-server-image
          path: ${{ runner.temp }}
      - id: push
        env:
          TREE: ${{ needs.key.outputs.tree }}
          IMAGE: ghcr.io/${{ github.repository }}-avendb
        run: |
          image="${IMAGE,,}"
          docker load --input "$RUNNER_TEMP/image.tar"
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag avendb-server:prebuilt "$image:tree-$TREE"
          docker push "$image:tree-$TREE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:tree-$TREE" | cut -d@ -f2)
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
