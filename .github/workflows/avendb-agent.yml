name: avenDB cloud agent

# avenDB's agent for Claude Code sessions in Anthropic's cloud (avendb-device agent cloud, agentCloud): a Linux x86_64
# build of avendb-device from avendb/ alone, put on the rolling release "avendb-agent" in place of the last one, which
# scripts/avendb-cloud.sh downloads when a cloud session starts it, as the repository's .mcp.json says (avendb/README.md,
# "Cloud sessions"). It holds no key: a session's key is the one theOS app showed once, in the environment's
# AVENDB_AGENT_KEY.
#
# Built on Ubuntu 22.04, so its glibc is older than a cloud session's (Ubuntu 24.04), and it runs there.
on:
  # Validate and release (main.yml) starts it with the commit it validated, so its build waits for nothing there
  workflow_dispatch:
    inputs:
      sha:
        description: The main commit to build (empty = the branch's head)
        type: string
        default: ''
      validated:
        description: Validate and release already checked this commit (only a commit on main counts)
        type: boolean
        default: false

concurrency:
  group: avendb-agent
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: avendb-agent
  ASSET: avendb-device-x86_64-linux

jobs:
  # a commit main.yml says it checked is believed only if it is on main; anything else runs avenDB's checks first
  trust:
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.on-main.outputs.validated }}
    steps:
      - id: on-main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ inputs.validated }}
          SHA: ${{ inputs.sha }}
        run: |
          # main is SHA itself or ahead of it: SHA is on main
          status=""
          if [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status || true)
          fi
          if [ "$VALIDATED" = "true" ] && { [ "$status" = "ahead" ] || [ "$status" = "identical" ]; }; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          else
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: trust
    if: ${{ needs.trust.outputs.validated != 'true' }}
    uses: ./.github/workflows/avendb-checks.yml

  build:
    needs: [trust, checks]
    if: ${{ !cancelled() && needs.trust.result == 'success' && (needs.checks.result == 'success' || (needs.trust.outputs.validated == 'true' && needs.checks.result == 'skipped')) }}
    name: Build the cloud agent and put it on its release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.trust.outputs.validated == 'true' && inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Rust builds are slow: keep the compiled dependencies between runs
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb
      - name: Build avendb-device
        working-directory: avendb
        run: cargo build --release --locked -p avendb-device
      - name: Put it on the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.trust.outputs.validated == 'true' && inputs.sha || github.sha }}
        run: |
          cp avendb/target/release/avendb-device "$ASSET"
          strip "$ASSET"
          ./"$ASSET" agent cloud < /dev/null
          sha256sum "$ASSET" > "$ASSET.sha256"
          notes="avendb-device agent cloud, built from ${BUILT} on $(date -u +%F). Cloud sessions of this repository download it through scripts/avendb-cloud.sh (avendb/README.md, Cloud sessions)."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "avenDB cloud agent" --notes "$notes" --prerelease --latest=false
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          gh release edit "$TAG" --notes "$notes"
