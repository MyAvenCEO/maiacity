name: Land accepted code

# The repo is the truth for the code that runs (Samuel 2026-10-16, C4): the admin accepts a Sandbox 7 MIP in the app,
# or keeps an agent's Generated UI draft, and this job writes it into code/ and merges it by PR; the deploy it starts
# is what makes it live (the API lands each MIP it finds in code/). Every few minutes it asks the database whether
# anything waits (deploy/code-export.sh count, a read over SSH), and stops there when nothing does.
#
#   workflow_dispatch with full: also every config version the database kept and every Generated UI view (the first
#   export, when code moved out of Postgres)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also every config version and every Generated UI view (the first export)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: code-land
  cancel-in-progress: false

env:
  APP_DIR: /opt/maia-city
  API_HOST: api.maia.city

jobs:
  land:
    name: Land what was decided
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare SSH
        run: |
          HOST=$(getent hosts "$API_HOST" | awk '{print $1}' | head -1)
          [ -n "$HOST" ] || { echo "::error::$API_HOST does not resolve"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' "$HOST" > ~/.ssh/config

      - name: Anything waiting?
        id: count
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          read -r MIPS VIEWS < <(ssh prod "cd $APP_DIR && bash -s -- count" < deploy/code-export.sh)
          echo "MIPs waiting: $MIPS, views kept: $VIEWS"
          if [ "$MIPS" = "0" ] && [ "$VIEWS" = "0" ]; then echo "mode=none" >> "$GITHUB_OUTPUT"; else echo "mode=land" >> "$GITHUB_OUTPUT"; fi

      - uses: oven-sh/setup-bun@v2
        if: steps.count.outputs.mode != 'none'
        with:
          bun-version: latest

      - name: Write it into code/
        id: write
        if: steps.count.outputs.mode != 'none'
        run: |
          bun install --frozen-lockfile
          ssh prod "cd $APP_DIR && bash -s -- ${{ steps.count.outputs.mode }}" < deploy/code-export.sh > "$RUNNER_TEMP/export.json"
          node scripts/code-land.mjs "$RUNNER_TEMP/export.json" "$RUNNER_TEMP/summary.md"
          node scripts/code-index.mjs --check
          if [ -z "$(git status --porcelain code/)" ]; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
          # the pages bundle code/index.js: the site deploys again only when it changed
          if git status --porcelain code/index.js | grep -q .; then echo "site=yes" >> "$GITHUB_OUTPUT"; else echo "site=no" >> "$GITHUB_OUTPUT"; fi

      - name: Merge it by PR
        if: steps.write.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'maiaCITY landing'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH="land/$(date -u +%Y%m%d-%H%M%S)"
          TITLE="Land accepted code: $(grep -m1 '^- ' "$RUNNER_TEMP/summary.md" | cut -c3- | cut -c1-90)"
          { echo "What the admin decided in the app, written into code/ by the landing job (.github/workflows/code-land.yml). The deploy this starts makes it live."; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/body.md"
          git checkout -b "$BRANCH"
          git add code/
          git commit -q -F - <<EOF
          $TITLE

          $(cat "$RUNNER_TEMP/summary.md")
          EOF
          git push -q origin "$BRANCH"
          if PR=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"); then
            echo "Opened $PR"
            gh pr merge "$PR" --squash --delete-branch
          else
            # the repository does not let this job open PRs: the same commit goes to main as it is
            echo "::warning::Could not open a PR; pushing the landing commit to main"
            git push -q origin "$BRANCH:main"
            git push -q origin --delete "$BRANCH"
          fi

      # a push made with this job's token starts no workflow, so the deploys are started here
      - name: Deploy it
        if: steps.write.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run api.yml --ref main
          if [ "${{ steps.write.outputs.site }}" = "yes" ]; then gh workflow run deploy.yml --ref main; fi
