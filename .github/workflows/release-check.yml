name: Release check

# The signed release (scripts/release.mjs): the live site against the list its deploy signed with the release key.
# Every file is fetched from https://maia.city and held to its BLAKE3 hash; a file swapped on the server, or a list
# signed by any other key, fails this. It runs after each deploy and every morning.
on:
  workflow_run:
    workflows: [Deploy the site]
    types: [completed]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: The live site holds its signed release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: node scripts/release.mjs check https://maia.city
