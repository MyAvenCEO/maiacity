# avenSANDBOX on GitHub (aven/DB2/SANDBOX.md). production takes changes from main only, and every change to it boots
# the sandbox from the box's image and checks it: the same `bun run up --check` a Claude cloud session or a Mac runs.
name: avenSANDBOX

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:

permissions: {}

concurrency:
  group: avensandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  from-main:
    name: Only from main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The pull request comes from main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != main ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::production takes changes from main only; this pull request comes from $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

  sandbox:
    name: avenSANDBOX
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Docker routes between its networks
        run: |
          conf=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$conf" | jq '. + {"allow-direct-routing": true}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: bun run up --check
        working-directory: aven/DB2
        run: bun run up --check
      - name: The run's screenshot and report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: avensandbox-run
          path: aven/DB2/runs/
          if-no-files-found: ignore
