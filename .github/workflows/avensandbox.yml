# avenSANDBOX on GitHub (aven/DB2/SANDBOX.md, "Production"). production takes changes from main only, and every change
# to it boots the sandbox from the box's image and checks it: the same `bun run up --check` a Claude cloud session or a
# Mac runs. Then each package that changed gets a release of its own, tagged @aven/<package>@<version>: the date in
# Berlin for its first release that day (26.10.29), then 26.10.29v2, 26.10.29v3, ... A package that didn't change gets
# no new version, and a push that changes none releases nothing. The packages: avenOS, avenSANDBOX and avenPEER.
name: avenSANDBOX

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:

permissions: {}

# a newer push to a pull request replaces its older run; production's pushes wait their turn, so each can release
concurrency:
  group: avensandbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  from-main:
    name: Only from main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The pull request comes from main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != main ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::production takes changes from main only; this pull request comes from $HEAD_REPO:$HEAD_REF"
            exit 1
          fi

  sandbox:
    name: avenSANDBOX
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.box.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # The P2P lanes route between Docker networks, which Docker 28.2 and later block unless allowed. Milestone 1 runs
      # on one network, so a runner whose Docker refuses the setting goes on without it, with a warning.
      - name: Docker routes between its networks
        run: |
          sudo cat /etc/docker/daemon.json > /tmp/daemon.json 2>/dev/null || echo '{}' > /tmp/daemon.json
          jq '. + {"allow-direct-routing": true}' /tmp/daemon.json | sudo tee /etc/docker/daemon.json > /dev/null
          if ! sudo systemctl restart docker; then
            echo "::warning::Docker $(docker version --format '{{.Client.Version}}') refused allow-direct-routing; running without it"
            sudo cp /tmp/daemon.json /etc/docker/daemon.json
            sudo systemctl reset-failed docker
            sudo systemctl restart docker
          fi
          docker version --format 'Docker {{.Server.Version}}'
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The box's image
        id: box
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/sandbox:$(node aven/DB2/sandbox/box/tag.mjs)" >> "$GITHUB_OUTPUT"
      - name: bun run up --check
        working-directory: aven/DB2
        env:
          AVENSANDBOX_IMAGE: ${{ steps.box.outputs.image }}
        run: bun run up --check
      - name: Build the release's deliverables
        if: github.event_name == 'push'
        working-directory: aven/DB2
        env:
          AVENSANDBOX_IMAGE: ${{ steps.box.outputs.image }}
        run: bun run build
      - name: Keep the deliverables for the release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deliverables
          path: aven/DB2/deliverables/
          if-no-files-found: error
      - name: The run's screenshot and report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: avensandbox-run
          path: aven/DB2/runs/
          if-no-files-found: ignore

  # avenPEER's slim image for this commit, built in its box unless an earlier push built the same inputs
  peer:
    name: avenPEER image
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/avenpeer-image.yml

  release:
    name: Release
    needs: [sandbox, peer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: deliverables
          path: deliverables
      - name: Release each package that changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ needs.sandbox.outputs.image }}
          PEER_IMAGE: ${{ needs.peer.outputs.image }}
        run: |
          set -euo pipefail
          day=$(TZ=Europe/Berlin date +%y.%m.%d)

          # A package's versions are its own tags, @aven/<package>@<version>: the date alone for its first release that
          # day (26.10.29), then 26.10.29v2, 26.10.29v3, ...
          next() {
            local taken last
            taken=$(git tag -l "@aven/$1@$day" "@aven/$1@${day}v*")
            if ! grep -qx "@aven/$1@$day" <<< "$taken"; then echo "$day"; return; fi
            last=$(sed -n "s#^@aven/$1@${day}v\([0-9][0-9]*\)\$#\1#p" <<< "$taken" | sort -n | tail -1)
            echo "${day}v$(( ${last:-1} + 1 ))"
          }
          latest() { git tag -l "@aven/$1@*" | sort -V | tail -1; }
          changes() {
            local prev=$1; shift
            if [ -z "$prev" ]; then echo "- The first release."; return; fi
            git log --no-merges --format='- %s (%h)' "$prev..$SHA" -- "$@"
            echo
            echo "**Full compare**: https://github.com/$REPO/compare/$prev...$SHA"
          }
          released=()

          # avenOS for the browser: released when its sources changed, the Peer-Light it carries at /peer-light/ included
          os_paths=(aven/DB2/os aven/DB2/brain aven/DB2/vite.config.js aven/DB2/package.json aven/DB2/bun.lock aven/DB2/sandbox/cast.json aven/DB2/id/core aven/DB2/peer aven/DB2/db aven/DB2/Cargo.toml aven/DB2/Cargo.lock)
          prev=$(latest os)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$SHA" -- "${os_paths[@]}"; then
            v=$(next os)
            file="aven-os-web-$v.tar.gz"
            mv deliverables/aven-os-web.tar.gz "deliverables/$file"
            (cd deliverables && sha256sum "$file" > SHA256SUMS)
            {
              echo "**avenOS** for the browser: \`$file\` below, checksum in \`SHA256SUMS\`."
              echo
              echo "## Changes"
              echo
              changes "$prev" "${os_paths[@]}"
            } > os.md
            gh release create "@aven/os@$v" --repo "$REPO" --target "$SHA" --title "avenOS $v" --notes-file os.md \
              "deliverables/$file" deliverables/SHA256SUMS
            released+=("avenOS $v")
          fi

          # avenSANDBOX: released when the box's image changed (its digest, so a new platform counts too)
          box="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/sandbox"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }
          prev=$(latest sandbox)
          now=$(digest "$IMAGE")
          if [ -z "$prev" ] || [ "$(digest "$box:${prev#@aven/sandbox@}")" != "$now" ]; then
            v=$(next sandbox)
            docker buildx imagetools create --tag "$box:$v" "$IMAGE"
            {
              echo "**avenSANDBOX**, the box (amd64 and arm64):"
              echo
              echo '```bash'
              echo "docker pull $box:$v"
              echo '```'
              echo
              echo "Digest: \`$box@$now\`"
              echo
              echo "## Changes"
              echo
              changes "$prev" aven/DB2/sandbox/box
            } > sandbox.md
            gh release create "@aven/sandbox@$v" --repo "$REPO" --target "$SHA" --title "avenSANDBOX $v" \
              --notes-file sandbox.md
            released+=("avenSANDBOX $v")
          fi

          # avenPEER: released when its image changed. Its tag is a hash of its inputs (aven/DB2/deploy/tag.mjs), so
          # an unchanged peer is the same image, the same digest
          peer="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/peer"
          prev=$(latest peer)
          now=$(digest "$PEER_IMAGE")
          [ -n "$now" ] || { echo "::error::$PEER_IMAGE is not published"; exit 1; }
          if [ -z "$prev" ] || [ "$(digest "$peer:${prev#@aven/peer@}")" != "$now" ]; then
            v=$(next peer)
            docker buildx imagetools create --tag "$peer:$v" "$PEER_IMAGE"
            peer_paths=(aven/DB2/peer aven/DB2/core aven/DB2/db/core aven/DB2/store aven/DB2/id/core aven/DB2/deploy/peer.Dockerfile aven/DB2/Cargo.toml aven/DB2/Cargo.lock)
            {
              echo "**avenPEER**, the node: \`aven-peer\` on a minimal base (amd64 and arm64)."
              echo "\`--relay\` makes it the Aven Peer."
              echo
              echo '```bash'
              echo "docker pull $peer:$v"
              echo '```'
              echo
              echo "Digest: \`$peer@$now\`"
              echo
              echo "## Changes"
              echo
              changes "$prev" "${peer_paths[@]}"
            } > peer.md
            gh release create "@aven/peer@$v" --repo "$REPO" --target "$SHA" --title "avenPEER $v" \
              --notes-file peer.md
            released+=("avenPEER $v")
          fi

          if [ ${#released[@]} -eq 0 ]; then
            echo "No package changed, so nothing is released." >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Released **%s**\n\n' "${released[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
