name: avenDB checks

# avenDB's checks for every pull request that touches it, so a thread pushes and lets them run here, in parallel,
# instead of running them for twenty minutes in its own small container:
#
#   tests  – the Rust tests of avenDB's workspace (the browser page test, `--ignored`, stays scripts/test-browser.sh's)
#   spec   – the Lean spec, the SSOT (avendb/spec): `lake build` proves it, checks its scenarios and holds the committed
#            vectors to the model; `lake exe vectors` must write nothing new (vectors regenerated and committed)
#   wasm   – the page's WebAssembly (src/lib/avendb/device, scripts/build-web.sh), built here from the PR's sources. When
#            the committed one differs, this job commits the one it built to the PR's branch, so no thread rebuilds it
#            by hand (pull before your next push). That commit runs the checks again, on the branch's real head; it
#            carries no [skip ci], which a squash merge copies into main's commit and skips every workflow there with it
#            (#1179, #1180, #1182). It is made as github-actions[bot] itself (41898282): as 41898, a stranger to the
#            repository, its runs had waited for an approval (#1173)
#
# On main too: GitHub lets a pull request restore only the caches its base branch saved, so the tests' and the
# spec's caches are warmed by a run on every merge that touches avenDB; without one, every PR compiled from scratch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'avendb/**'
      - 'src/lib/avendb/device/**'
      - '.github/workflows/avendb-checks.yml'
  push:
    branches: [main]
    paths:
      - 'avendb/**'
      - 'src/lib/avendb/device/**'
      - '.github/workflows/avendb-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avendb-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not on a draft (Samuel 2026-10-21): a thread's every push to its draft ran all three, ten minutes each. They run
  # once the PR is marked ready, and on every push after; merge only once they are green there
  tests:
    name: avenDB tests (${{ matrix.name }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            cache: core
            args: -p avendb
          # avendb-device's own build is the long pole (about 7 of 10 minutes compiling), so it and the browser's
          # tests, which build on it, run beside the network's and the server's rather than after them
          - name: net, server
            cache: net-server
            args: -p avendb-net -p avendb-server
          - name: device, browser
            cache: device-browser
            args: -p avendb-device -p avendb-browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avendb -> target
          # a cache key takes no commas: the shard's own, not its name (with one, the restore failed and nothing was saved)
          key: tests-${{ matrix.cache }}
          cache-on-failure: true
      - name: cargo test
        working-directory: avendb
        run: cargo test --locked ${{ matrix.args }}

  spec:
    name: Lean spec and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('avendb/spec/lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: avendb/spec/.lake
          key: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-${{ hashFiles('avendb/spec/**/*.lean', 'avendb/spec/vectors/**') }}
          restore-keys: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-
      - name: elan
        run: |
          if [ ! -x ~/.elan/bin/lake ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: avendb/spec
        run: lake build
      - name: The committed vectors are the model's
        working-directory: avendb/spec
        run: |
          lake exe vectors
          if ! git diff --exit-code -- vectors; then
            echo "::error::avendb/spec/vectors differ from what the model writes: run \`lake exe vectors\` in avendb/spec and commit them"
            exit 1
          fi

  wasm:
    name: The page's WebAssembly
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avendb -> target
          key: wasm
          cache-on-failure: true
      - run: avendb/scripts/build-web.sh
      - name: Commit it where it changed
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet -- src/lib/avendb/device && [ -z "$(git ls-files --others --exclude-standard src/lib/avendb/device)" ]; then
            echo "The committed WebAssembly is the one these sources build."
            exit 0
          fi
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::src/lib/avendb/device is stale: run avendb/scripts/build-web.sh and commit what it writes"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/lib/avendb/device
          git commit -m "avenDB: the page's WebAssembly, built by CI from this branch's sources"
          git push
          echo "::notice::Committed the rebuilt WebAssembly to this branch: pull before your next push."
