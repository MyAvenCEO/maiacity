name: avenDB checks

# avenDB's checks for every pull request that touches it, so a thread pushes and lets them run here, in parallel,
# instead of running them for twenty minutes in its own small container:
#
#   tests  – the Rust tests of avenDB's workspace (the browser page test, `--ignored`, stays scripts/test-browser.sh's)
#   spec   – the Lean spec, the SSOT (avendb/spec): `lake build` proves it, checks its scenarios and holds the committed
#            vectors to the model; `lake exe vectors` must write nothing new (vectors regenerated and committed)
#
# The page's WebAssembly, built and committed to a PR's branch, is avendb-wasm.yml's: it needs to write, and these
# checks only read.
#
# And before every deploy of avenDB's server: avendb.yml calls them on the commit it builds, and restarts nothing
# unless they passed.
#
# On main too: GitHub lets a pull request restore only the caches its base branch saved, so the tests' and the
# spec's caches are warmed by a run on every merge that touches avenDB; without one, every PR compiled from scratch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'avendb/**'
      - 'src/lib/avendb/device/**'
      - '.github/workflows/avendb-checks.yml'
      - 'scripts/ci/**'
  workflow_call:
    inputs:
      real_browser:
        type: boolean
        default: false
      protocol:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      frontend_only:
        description: Run isolated Svelte and shared observer checks without a deployment or native build
        type: boolean
        default: false
      real_browser_only:
        description: Run the disposable real Chromium/WASM fixture instead of repeating native suites
        type: boolean
        default: false

permissions:
  contents: read

# a pull request's new push replaces its run; a run avendb.yml called is its own (avendb.yml's group holds it)
concurrency:
  group: avendb-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      browser: ${{ steps.paths.outputs.browser }}
      protocol: ${{ steps.paths.outputs.protocol }}
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: paths
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: bun scripts/ci/impact.mjs
  # Not on a draft (Samuel 2026-10-21): a thread's every push to its draft ran all three, ten minutes each. They run
  # once the PR is marked ready, and on every push after; merge only once they are green there
  tests:
    needs: impact
    name: avenDB tests (${{ matrix.name }})
    if: needs.impact.outputs.native == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.real_browser_only && !inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the property tests are most of core's time (869 of about 1,300 test-seconds on 2026-10-21, t19 alone 126 s)
          # and nextest starts them last, so core ran 7 minutes; on a runner of their own they run beside the rest.
          # Separate execution styles: nextest for isolation, libtest for shared immutable histories.
          - name: core
            cache: core
            args: -p avendb
            filter: -E 'not binary_id(avendb::properties)'
            doc: true
          - name: core properties
            cache: core
            args: -p avendb
            filter: --test properties
            properties: true
          # avendb-device's own build is the long pole (about 7 of 10 minutes compiling), so it and the browser's
          # tests, which build on it, run beside the network's and the server's rather than after them
          - name: net, server
            cache: net-server
            args: -p avendb-net -p avendb-server
            doc: true
          - name: device, browser
            cache: device-browser
            args: -p avendb-device -p avendb-browser
            doc: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb -> target
          # a cache key takes no commas: the shard's own, not its name (with one, the restore failed and nothing was saved)
          key: tests-${{ matrix.cache }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Our own crates' tests built at opt-level 1, not dev's 2 (the dependencies keep theirs): each test file took 70
      # to 150 s to build at 2. Locally (2026-10-21) the net and server tests built in 2m47s at 1 and ran as fast as at
      # 2 (220 s against 216 s); here they had taken 6m57s to build.
      # nextest runs every test as a program of its own, all test files side by side, where cargo test runs one file
      # after the other. Each program would make the McEliece pairs of the same fixed keys again, so AVENDB_TEST_PAIRS
      # gives them one folder to share them in (keys.rs, `test_pairs`): the net and server tests ran in 113 s, against
      # 216 s with cargo test and 261 s with nextest alone (locally, 2026-10-21)
      - name: cargo nextest
        if: ${{ !matrix.properties }}
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: cargo nextest run --locked --no-tests=fail --features test-fixtures ${{ matrix.args }} ${{ matrix.filter }}
      # This binary shares immutable 40-seed histories via LazyLock. A process per property rebuilt them 37 times.
      - name: Shared-history properties (all seeds and invariants)
        if: matrix.properties
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: cargo test --locked --features test-fixtures -p avendb --test properties -- --test-threads=2
      # nextest runs no doc tests
      - name: cargo test --doc
        if: matrix.doc
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
        run: cargo test --locked --features test-fixtures --doc ${{ matrix.args }}

  image:
    needs: impact
    name: avenDB server image builds
    # The release patches a local dependency: exercise cargo-chef and the Docker
    # context before merge, without publishing an image or touching production.
    if: needs.impact.outputs.server == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: avendb
          file: avendb/Dockerfile.server
          push: false
          cache-from: type=gha,scope=avendb-pr
          cache-to: type=gha,scope=avendb-pr,mode=max

  spec:
    if: ${{ !inputs.real_browser_only && !inputs.frontend_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Lean spec and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('avendb/spec/lean-toolchain') }}
      - uses: actions/cache@v6.1.0
        with:
          path: avendb/spec/.lake
          key: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-${{ hashFiles('avendb/spec/**/*.lean', 'avendb/spec/vectors/**') }}
          restore-keys: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-
      - name: elan
        run: |
          if [ ! -x ~/.elan/bin/lake ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: avendb/spec
        run: lake build
      - name: The committed vectors are the model's
        working-directory: avendb/spec
        run: |
          lake exe vectors
          if ! git diff --exit-code -- vectors; then
            echo "::error::avendb/spec/vectors differ from what the model writes: run \`lake exe vectors\` in avendb/spec and commit them"
            exit 1
          fi

  real-browser:
    needs: impact
    name: Disposable real Chromium and WASM
    if: ${{ !inputs.frontend_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (inputs.real_browser || inputs.real_browser_only || needs.impact.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb -> target
          key: real-browser-localhost
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install disposable test browser
        run: bunx --bun playwright install --with-deps chromium
      - name: Real API with disposable localhost identities
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: |
          export AVENDB_CHROMIUM="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -type f | head -n 1)"
          test -x "$AVENDB_CHROMIUM"
          export AVENDB_NODE="$(command -v bun)"
          avendb/scripts/test-browser.sh
          # localhost-passkeys artifacts are test-only and must never replace the shipped package.
          git diff --exit-code -- src/lib/avendb/device

  frontend:
    name: avenDB targeted UI types and scheduling
    if: github.event_name == 'workflow_dispatch' && inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun run check
      - run: bun test ./src/lib/avendb/

  protocol:
    needs: impact
    name: Protocol models and negative controls
    if: ${{ !inputs.real_browser_only && !inputs.frontend_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (inputs.protocol || needs.impact.outputs.protocol == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: verifpal@1.6.5
      - run: avendb/spec/protocol/check.sh

  required:
    name: avenDB required checks
    if: ${{ always() }}
    needs: [impact, tests, image, spec, real-browser, protocol, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR: ${{ github.event_name == 'pull_request' }}
          FRONTEND: ${{ inputs.frontend_only || false }}
          BROWSER_ONLY: ${{ inputs.real_browser_only || false }}
          BROWSER: ${{ inputs.real_browser || false }}
          PROTOCOL: ${{ inputs.protocol || false }}
        run: |
          printf '%s' "$RESULTS" | jq -e '
            . as $r |
            [$r.impact.outputs] | .[0] as $p |
            (["impact"] +
              (if env.FRONTEND == "true" then ["frontend"] else [] end) +
              (if env.DRAFT != "true" and env.FRONTEND != "true" then
                (if env.BROWSER_ONLY != "true" then
                  ["spec"] + (if $p.native == "true" then ["tests"] else [] end) +
                  (if env.PROTOCOL == "true" or $p.protocol == "true" then ["protocol"] else [] end)
                 else [] end) +
                (if env.BROWSER == "true" or env.BROWSER_ONLY == "true" or $p.browser == "true" then ["real-browser"] else [] end)
               else [] end) +
              (if env.PR == "true" and env.DRAFT != "true" and $p.server == "true" then ["image"] else [] end)
            ) as $expected |
            all($r[]; .result == "success" or .result == "skipped") and
            all($expected[]; $r[.].result == "success")'
