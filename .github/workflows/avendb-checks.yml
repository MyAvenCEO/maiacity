name: avenDB checks

# avenDB's checks for every pull request that touches it, so a thread pushes and lets them run here, in parallel,
# instead of running them for twenty minutes in its own small container:
#
#   tests  – the Rust tests of avenDB's workspace (the browser page test, `--ignored`, stays scripts/test-browser.sh's)
#   spec   – the Lean spec, the SSOT (avendb/spec): `lake build` proves it, checks its scenarios and holds the committed
#            vectors to the model; `lake exe vectors` must write nothing new (vectors regenerated and committed)
#   bench  – the performance gates (avendb/bench-gates.json): writes, point reads, views and a first sync at 10k, 100k and
#            1M edits, and the relay's carrier apart from the direct path, beside a Postgres doing the same work; and
#            the phone-class row, the device as WebAssembly in Chromium and WebKit (bench-phone, printed, not gated)
#
# The page's WebAssembly, built and committed to a PR's branch, is avendb-wasm.yml's: it needs to write, and these
# checks only read.
#
# And before every deploy of avenDB's server: avendb.yml calls them on the commit it builds, and restarts nothing
# unless they passed.
#
# On main too: GitHub lets a pull request restore only the caches its base branch saved, so the tests' and the
# spec's caches are warmed by a run on every merge that touches avenDB; without one, every PR compiled from scratch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'avendb/**'
      - 'src/lib/avendb/**'
      - 'scripts/avendb-browser-transports.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/**'
      - 'scripts/ci/**'
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      real_browser:
        type: boolean
        default: false
      protocol:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      frontend_only:
        description: Run isolated Svelte and shared observer checks without a deployment or native build
        type: boolean
        default: false
      real_browser_only:
        description: Run the disposable real Chromium/WASM fixture instead of repeating native suites
        type: boolean
        default: false
      bench_only:
        description: Run the performance gates alone (a draft's branch, whose PR runs no suite)
        type: boolean
        default: false

permissions:
  contents: read

# a pull request's new push replaces its run; a run avendb.yml called is its own (avendb.yml's group holds it).
# CI's own WebAssembly commit (avendb-wasm.yml) waits for the run in progress instead: that run's pass markers then let
# it skip every job whose files the commit did not touch, where cancelling had started them all again from zero
concurrency:
  group: avendb-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}

jobs:
  # what changed (impact.mjs) and which jobs passed before on this PR with these files (passes.mjs), in one job
  impact:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      browser: ${{ steps.paths.outputs.browser }}
      protocol: ${{ steps.paths.outputs.protocol }}
      server: ${{ steps.paths.outputs.server }}
      image: ${{ steps.paths.outputs.image }}
      # pass_<job>: the job passed before on this PR with the same files
      pass_tests: ${{ steps.tests.outputs.cache-hit }}
      tests_key: ${{ steps.passes.outputs.tests_key }}
      pass_image: ${{ steps.image.outputs.cache-hit }}
      image_key: ${{ steps.passes.outputs.image_key }}
      pass_spec: ${{ steps.spec.outputs.cache-hit }}
      spec_key: ${{ steps.passes.outputs.spec_key }}
      pass_browser: ${{ steps.browser.outputs.cache-hit }}
      browser_key: ${{ steps.passes.outputs.browser_key }}
      pass_protocol: ${{ steps.protocol.outputs.cache-hit }}
      protocol_key: ${{ steps.passes.outputs.protocol_key }}
      pass_bench: ${{ steps.bench.outputs.cache-hit }}
      bench_key: ${{ steps.passes.outputs.bench_key }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: paths
        env:
          FORCE_FULL: ${{ inputs.full || false }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          if [ "$FORCE_FULL" = true ]; then unset CI_BASE; fi
          bun scripts/ci/impact.mjs
      # Pass markers (scripts/ci/passes.mjs, pull requests only): a job that passed on this PR with the same files is
      # skipped; `required` saves a marker for each job that passed. The native jobs read avenDB alone; the real browser
      # also reads the page's avenDB code, but builds its own WebAssembly, so not the committed one
      - id: passes
        env:
          SELF: .github/workflows/avendb-checks.yml
          # what avenDB's crates read from outside avendb/ (include_str!, #[path])
          OUTSIDE: src/lib/code/packages.json,vault/app/src/avendb_shutdown.rs
        run: |
          bun scripts/ci/passes.mjs \
            "tests=avendb,$OUTSIDE,$SELF" "image=avendb,$SELF" "spec=avendb/spec,$SELF" "protocol=avendb,$SELF" \
            "bench=avendb,$OUTSIDE,$SELF" \
            "browser=avendb,$OUTSIDE,src/lib/avendb,!src/lib/avendb/device,scripts/avendb-browser-transports.mjs,$SELF"
      - id: tests
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.tests_key }}
          lookup-only: true
      - id: image
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.image_key }}
          lookup-only: true
      - id: spec
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.spec_key }}
          lookup-only: true
      - id: browser
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.browser_key }}
          lookup-only: true
      - id: protocol
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.protocol_key }}
          lookup-only: true
      - id: bench
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.bench_key }}
          lookup-only: true
  # Not on a draft (Samuel 2026-10-21): a thread's every push to its draft ran all three, ten minutes each. They run
  # once the PR is marked ready, and on every push after; merge only once they are green there
  tests:
    needs: impact
    name: avenDB tests (${{ matrix.name }})
    if: needs.impact.outputs.native == 'true' && needs.impact.outputs.pass_tests != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.real_browser_only && !inputs.frontend_only && !inputs.bench_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the property tests are most of core's time (869 of about 1,300 test-seconds on 2026-10-21, t19 alone 126 s)
          # and nextest starts them last, so core ran 7 minutes; on a runner of their own they run beside the rest.
          # Separate execution styles: nextest for isolation, libtest for shared immutable histories.
          - name: core
            cache: core
            args: -p avendb
            filter: -E 'not binary_id(avendb::properties)'
            doc: true
          - name: core properties
            cache: core
            args: -p avendb
            filter: --test properties
            properties: true
          # avendb-device's own build is the long pole (about 7 of 10 minutes compiling), so it and the browser's
          # tests, which build on it, run beside the network's and the server's rather than after them
          # net and server apart, each on its own runner: together they built for about 4.8 and ran for 2.9 minutes
          # (8.2 in all, the longest job, 2026-10-27); the server's build still makes net's library, not its tests
          - name: net
            cache: net
            args: -p avendb-net
            doc: true
          - name: server
            cache: server
            args: -p avendb-server
            doc: true
          - name: device, browser
            cache: device-browser
            args: -p avendb-device -p avendb-browser
            doc: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb -> target
          # a cache key takes no commas: the shard's own, not its name (with one, the restore failed and nothing was saved)
          key: tests-${{ matrix.cache }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # mold links the 23 test programs in a fraction of ld's time
      - uses: rui314/setup-mold@v1
      # Our own crates' tests built at opt-level 1, not dev's 2 (the dependencies keep theirs): each test file took 70
      # to 150 s to build at 2. Locally (2026-10-21) the net and server tests built in 2m47s at 1 and ran as fast as at
      # 2 (220 s against 216 s); here they had taken 6m57s to build.
      # nextest runs every test as a program of its own, all test files side by side, where cargo test runs one file
      # after the other. Each program would make the McEliece pairs of the same fixed keys again, so AVENDB_TEST_PAIRS
      # gives them one folder to share them in (keys.rs, `test_pairs`): the net and server tests ran in 113 s, against
      # 216 s with cargo test and 261 s with nextest alone (locally, 2026-10-21)
      - name: cargo nextest
        if: ${{ !matrix.properties }}
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: cargo nextest run --profile ci --locked --no-fail-fast --no-tests=fail --features test-fixtures ${{ matrix.args }} ${{ matrix.filter }}
      # This binary shares immutable 40-seed histories via LazyLock. A process per property rebuilt them 37 times.
      - name: Shared-history properties (all seeds and invariants)
        if: matrix.properties
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: cargo test --locked --features test-fixtures -p avendb --test properties -- --test-threads=2
      # nextest runs no doc tests
      - name: cargo test --doc
        if: matrix.doc
        working-directory: avendb
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
        run: cargo test --locked --features test-fixtures --doc ${{ matrix.args }}

  image:
    needs: impact
    name: avenDB server image builds
    # The release patches a local dependency: exercise cargo-chef and the Docker
    # context before merge, without publishing an image or touching production.
    # Only when what the image build reads beyond the tests' code changes (impact.mjs, imageInputs): the code itself the
    # tests compile, and main builds the image on every server change. A pull request from this repository has it
    # built already, by server-prebuild.yml (its own check on the PR, and the image main promotes): only a fork's builds here
    if: needs.impact.outputs.image == 'true' && needs.impact.outputs.pass_image != 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: avendb
          file: avendb/Dockerfile.server
          push: false
          cache-from: type=gha,scope=avendb-pr
          cache-to: type=gha,scope=avendb-pr,mode=max

  spec:
    needs: impact
    if: ${{ needs.impact.outputs.pass_spec != 'true' && !inputs.real_browser_only && !inputs.frontend_only && !inputs.bench_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Lean spec and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('avendb/spec/lean-toolchain') }}
      - uses: actions/cache@v6.1.0
        with:
          path: avendb/spec/.lake
          key: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-${{ hashFiles('avendb/spec/**/*.lean', 'avendb/spec/vectors/**') }}
          restore-keys: lake-${{ hashFiles('avendb/spec/lean-toolchain') }}-
      - name: elan
        run: |
          if [ ! -x ~/.elan/bin/lake ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: avendb/spec
        run: lake build
      - name: The committed vectors are the model's
        working-directory: avendb/spec
        run: |
          lake exe vectors
          if ! git diff --exit-code -- vectors; then
            echo "::error::avendb/spec/vectors differ from what the model writes: run \`lake exe vectors\` in avendb/spec and commit them"
            exit 1
          fi

  real-browser:
    needs: impact
    name: Disposable real Chromium and WASM
    if: ${{ needs.impact.outputs.pass_browser != 'true' && !inputs.frontend_only && !inputs.bench_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (inputs.real_browser || inputs.real_browser_only || needs.impact.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # test-browser.sh builds the page's WebAssembly in target-wasm, beside the native tests in target
          workspaces: |
            avendb -> target
            avendb -> target-wasm
          key: real-browser-localhost
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The transport contract requires PQ WebTransport, absent in the older security-probe Chromium.
      - name: Install current disposable transport browser
        run: |
          mkdir -p "$RUNNER_TEMP/avendb-transports"
          bun add --cwd "$RUNNER_TEMP/avendb-transports" --ignore-scripts --exact playwright@1.64.1
          scripts/ci/browser-deps.sh "$RUNNER_TEMP/avendb-transports/node_modules/playwright/cli.js" chromium
      - name: Real API with disposable localhost identities
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 1
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: |
          export AVENDB_TEST_PLAYWRIGHT="$RUNNER_TEMP/avendb-transports/node_modules/playwright/index.mjs"
          export AVENDB_CHROMIUM="$(bun -e 'const { chromium } = await import(process.env.AVENDB_TEST_PLAYWRIGHT); console.log(chromium.executablePath())')"
          test -x "$AVENDB_CHROMIUM"
          export AVENDB_NODE="$(command -v bun)"
          avendb/scripts/test-browser.sh
          # localhost-passkeys artifacts are test-only and must never replace the shipped package.
          git diff --exit-code -- src/lib/avendb/device

  frontend:
    name: avenDB targeted UI types and scheduling
    if: github.event_name == 'workflow_dispatch' && inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun run check
      - run: bun test ./src/lib/avendb/

  protocol:
    needs: impact
    name: Protocol models and negative controls
    if: ${{ needs.impact.outputs.pass_protocol != 'true' && !inputs.real_browser_only && !inputs.frontend_only && !inputs.bench_only && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (inputs.protocol || needs.impact.outputs.protocol == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install checksum-pinned Verifpal 1.6.5
        run: |
          archive="$RUNNER_TEMP/verifpal.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/symbolicsoft/verifpal/releases/download/v1.6.5/verifpal_1.6.5_linux_amd64.zip -o "$archive"
          echo "2591c48afd63871433197f6da199bde756b13dd6a0a51b6998799ee199061302  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/verifpal-bin"
          unzip -q "$archive" verifpal -d "$RUNNER_TEMP/verifpal-bin"
          chmod 755 "$RUNNER_TEMP/verifpal-bin/verifpal"
          echo "$RUNNER_TEMP/verifpal-bin" >> "$GITHUB_PATH"
      - run: avendb/spec/protocol/check.sh

  # The performance gates (avendb/bench-gates.json, scripts/ci/avendb-bench.mjs): avenDB's bench (tests/bench_gates.rs)
  # at 10k, 100k and 1M edits, each size a process of its own so its resident memory is its own, and a first sync asked
  # both ways; two real nodes taking a peer's edits directly and through the server's relay alone, at full speed and at
  # a set link rate (avendb-server's tests/relay_bench.rs, a debug build as the scenarios' world is the tests' alone);
  # then the same work on a Postgres beside it, printed next to avenDB's numbers (to the job's summary too). A gate
  # missed fails the job, and so the PR; a target not reached yet is printed and fails nothing.
  bench:
    needs: impact
    name: avenDB performance gates
    if: needs.impact.outputs.native == 'true' && needs.impact.outputs.pass_bench != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.real_browser_only && !inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # optimised as a release, but in parallel codegen units and thin LTO (the server profile's trade): the release
      # profile's one unit and full LTO are for the tile's WebAssembly, and took minutes more to build
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb -> target
          key: bench
          cache-on-failure: true
      - uses: rui314/setup-mold@v1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build the bench
        working-directory: avendb
        run: |
          cargo test --release --locked -p avendb --test bench_gates --no-run
          cargo test --locked -p avendb-server --features test-fixtures --test relay_bench --no-run
      - name: avenDB at 10k, 100k and 1M edits, and a first sync
        working-directory: avendb
        run: |
          for n in 10000 100000 1000000; do
            AVENDB_BENCH_N=$n cargo test --release --locked -p avendb --test bench_gates -- --ignored --nocapture --exact bench_scale \
              | tee -a "$RUNNER_TEMP/bench.log"
          done
          AVENDB_BENCH_FIRST=10000:2000,50000:3000 cargo test --release --locked -p avendb --test bench_gates -- --ignored --nocapture --exact bench_first_sync \
            | tee -a "$RUNNER_TEMP/bench.log"
      - name: The carriers, direct and through the relay
        working-directory: avendb
        env:
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: |
          for c in direct relay relay_link; do
            AVENDB_CARRIER=$c cargo test --locked -p avendb-server --features test-fixtures --test relay_bench -- --ignored --nocapture --exact bench_carrier \
              | tee -a "$RUNNER_TEMP/bench.log"
          done
      - name: Postgres, the same work
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun scripts/ci/avendb-bench-pg.mjs 10000,100000,1000000 | tee "$RUNNER_TEMP/pg.log"
      - name: The gates
        run: bun scripts/ci/avendb-bench.mjs "$RUNNER_TEMP/bench.log" "$RUNNER_TEMP/pg.log"

  # The phone-class row: avenDB's device as WebAssembly in Chromium and WebKit, as an iPhone's page runs it, taking a
  # peer's signed edits with their signatures checked (avendb-browser's `bench` feature, scripts/ci/avendb-bench-phone.mjs)
  # on a synthetic fixture (avendb/tests/phone_fixture.rs). It gates nothing yet (Samuel, 2026-10-27: print it, the
  # target is 20k edits/s), so `required` doesn't wait on it.
  bench-phone:
    needs: impact
    name: avenDB phone-class bench (WebAssembly in Chromium and WebKit)
    if: needs.impact.outputs.native == 'true' && needs.impact.outputs.pass_bench != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.real_browser_only && !inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: avendb -> target
          key: bench-phone
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: The page's WebAssembly, with the bench, and the fixture
        working-directory: avendb
        env:
          AVENDB_TEST_PAIRS: ${{ runner.temp }}/avendb-test-pairs
        run: |
          cargo build --locked -p avendb-browser --target wasm32-unknown-unknown --release --features bench
          wasm-bindgen --target web --no-typescript --out-dir "$RUNNER_TEMP/phone-pkg" target/wasm32-unknown-unknown/release/avendb_browser.wasm
          AVENDB_PHONE_FIXTURE="$RUNNER_TEMP/phone.bin" cargo test --locked -p avendb --features test-fixtures --test phone_fixture -- --ignored --nocapture
      - name: Chromium and WebKit
        run: |
          scripts/ci/browser-deps.sh node_modules/playwright/cli.js chromium
          scripts/ci/browser-deps.sh node_modules/playwright/cli.js webkit
          bun scripts/ci/avendb-bench-phone.mjs "$RUNNER_TEMP/phone-pkg" "$RUNNER_TEMP/phone.bin" chromium,webkit | tee "$RUNNER_TEMP/phone.log"
          bun scripts/ci/avendb-bench.mjs "$RUNNER_TEMP/phone.log" --phone

  required:
    name: avenDB required checks
    if: ${{ always() }}
    needs: [impact, tests, image, spec, real-browser, protocol, frontend, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR: ${{ github.event_name == 'pull_request' }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          FRONTEND: ${{ inputs.frontend_only || false }}
          BROWSER_ONLY: ${{ inputs.real_browser_only || false }}
          BROWSER: ${{ inputs.real_browser || false }}
          PROTOCOL: ${{ inputs.protocol || false }}
          BENCH_ONLY: ${{ inputs.bench_only || false }}
        run: |
          printf '%s' "$RESULTS" | jq -e '
            . as $r |
            [$r.impact.outputs] | .[0] as $p |
            (["impact"] +
              (if env.FRONTEND == "true" then ["frontend"] else [] end) +
              (if env.DRAFT != "true" and env.FRONTEND != "true" and env.BENCH_ONLY != "true" then
                (if env.BROWSER_ONLY != "true" then
                  ["spec"] + (if $p.native == "true" then ["tests"] else [] end) +
                  (if env.PROTOCOL == "true" or $p.protocol == "true" then ["protocol"] else [] end)
                 else [] end) +
                (if env.BROWSER == "true" or env.BROWSER_ONLY == "true" or $p.browser == "true" then ["real-browser"] else [] end)
               else [] end) +
              (if env.DRAFT != "true" and env.FRONTEND != "true" and env.BROWSER_ONLY != "true" and $p.native == "true" then ["bench"] else [] end) +
              (if env.PR == "true" and env.FORK == "true" and env.DRAFT != "true" and $p.image == "true" then ["image"] else [] end)
            ) as $expected |
            {"tests":"tests","image":"image","spec":"spec","real-browser":"browser","protocol":"protocol","bench":"bench"} as $marker |
            all($r[]; .result == "success" or .result == "skipped") and
            all($expected[]; $r[.].result == "success" or
              ($r[.].result == "skipped" and env.PR == "true" and $marker[.] != null and $r.impact.outputs["pass_" + $marker[.]] == "true"))'
      # each job that passed: the next run of this PR with the same files skips it (scripts/ci/passes.mjs)
      - if: always() && github.event_name == 'pull_request'
        run: echo passed > .pass
      - if: always() && github.event_name == 'pull_request' && needs.tests.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.tests_key }}
      - if: always() && github.event_name == 'pull_request' && needs.image.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.image_key }}
      - if: always() && github.event_name == 'pull_request' && needs.spec.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.spec_key }}
      - if: always() && github.event_name == 'pull_request' && needs.real-browser.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.browser_key }}
      - if: always() && github.event_name == 'pull_request' && needs.protocol.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.protocol_key }}
      - if: always() && github.event_name == 'pull_request' && needs.bench.result == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.impact.outputs.bench_key }}
