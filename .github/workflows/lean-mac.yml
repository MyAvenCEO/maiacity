name: Lean on macOS

# Real Lean in theOS (avendb/crates/avendb-device/src/lean.rs, N3): on a Mac runner, the device gets the pinned Lean
# release (from Lean's releases here, standing in for Maia City's copy in avenDB, where theOS gets it), checks its
# SHA-256 and BLAKE3, unpacks what it keeps, compiles the spec's objective module and
# checks objectives, and its sandbox stops a file that got past the input wall from reading the person's files, writing
# or starting anything. Only for pull requests that touch it: it downloads Lean's 570 MB archive each run.
on:
  pull_request:
    paths:
      - 'avendb/crates/avendb-device/src/lean.rs'
      - 'src/lib/code/packages.json'
      - 'avendb/spec/AvenDB/Objective.lean'
      - 'avendb/spec/lean-toolchain'
      - '.github/workflows/lean-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-mac-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean runs locked down on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avendb -> target
          key: lean
          cache-on-failure: true

      - name: Lean got, checked and locked down
        working-directory: avendb
        run: cargo test --locked -p avendb-device --lib lean::tests::lean_on_a_mac -- --ignored --nocapture

      # what the sandbox denied Lean, by operation and path, and why Lean stopped (its crash report: the reason and the
      # stopped thread's frames): Lean's own folder and the runner's, nothing of a person's
      - name: What the sandbox stopped
        if: failure()
        run: |
          sudo log show --last 20m --style compact --predicate 'eventMessage CONTAINS "deny(" AND eventMessage CONTAINS "lean"' | tail -60 || true
          python3 - <<'PY' || true
          import glob, json, os
          for f in sorted(glob.glob(os.path.expanduser('~/Library/Logs/DiagnosticReports/lean*.ips')))[:2]:
              body = json.loads(open(f).read().split('\n', 1)[1])
              print(f, json.dumps(body.get('termination')), json.dumps(body.get('asi')), json.dumps(body.get('exception')))
              images = body.get('usedImages', [])
              thread = next((t for t in body.get('threads', []) if t.get('triggered')), {})
              for frame in thread.get('frames', [])[:30]:
                  i = frame.get('imageIndex')
                  name = images[i].get('name') if i is not None and i < len(images) else None
                  print('   ', name, frame.get('symbol'), frame.get('symbolLocation'))
          PY
