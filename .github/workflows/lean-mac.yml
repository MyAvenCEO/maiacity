name: Lean on macOS

# Real Lean in The OS (avendb/crates/avendb-device/src/lean.rs, N3): on a Mac runner, the device gets the pinned Lean
# release from GitHub as The OS does, checks its SHA-256, unpacks what it keeps, compiles the spec's objective module and
# checks objectives, and its sandbox stops a file that got past the input wall from reading the person's files, writing
# or starting anything. Only for pull requests that touch it: it downloads Lean's 570 MB archive each run.
on:
  pull_request:
    paths:
      - 'avendb/crates/avendb-device/src/lean.rs'
      - 'avendb/spec/AvenDB/Objective.lean'
      - 'avendb/spec/lean-toolchain'
      - '.github/workflows/lean-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-mac-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean runs locked down on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avendb -> target
          key: lean
          cache-on-failure: true

      - name: Lean got, checked and locked down
        working-directory: avendb
        run: cargo test --locked -p avendb-device --lib lean::tests::lean_on_a_mac -- --ignored --nocapture

      # what the sandbox denied Lean, by operation and path: Lean's own folder and the runner's, nothing of a person's
      - name: What the sandbox stopped
        if: failure()
        run: log show --last 20m --style compact --predicate 'eventMessage CONTAINS "Sandbox: lean(" OR eventMessage CONTAINS "Sandbox: sandbox-exec("' | tail -80 || true
