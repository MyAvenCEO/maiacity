name: avenDB bucket

# What avenDB's bucket (maiacity-avendb) holds, and what it can do. Run by hand only.
#
#   measure – read only: objects and bytes by kind of object (ids and hashes folded to *), the spread of their sizes,
#             and how many object versions the bucket keeps beside the current ones. The repo is public, so the log
#             shows only these sums, never an object's name.
#   probe   – may Hetzner refuse a write on a condition (If-None-Match, If-Match) in a versioned bucket with Object
#             Lock, like ours? Puts at most 3 versions of one small object under probe/<run>/, which the server never
#             reads (it reads only generations/ and g<n>/). Nothing is deleted: Object Lock keeps each version 7 days
#             anyway, and removing the object later is Samuel's call.
#
# Its numbers size the edit-pack work in the object-storage plan (Claude Doc "avenDB on object storage").
on:
  workflow_dispatch:
    inputs:
      step:
        description: measure (read only) or probe (puts one small object under probe/)
        type: choice
        options: [measure, probe]
        default: measure

permissions:
  contents: read

concurrency:
  group: avendb-bucket
  cancel-in-progress: false

env:
  BUCKET: maiacity-avendb
  S3_ENDPOINT: https://hel1.your-objectstorage.com
  AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: hel1
  # Hetzner takes no default CRC32 checksums: one only where S3 asks for it
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  measure:
    if: ${{ inputs.step == 'measure' }}
    name: Measure avenDB's bucket (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Objects by kind
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::set HETZNER_S3_ACCESS_KEY and HETZNER_S3_SECRET_KEY"; exit 1; }
          s3() { aws s3api --endpoint-url "$S3_ENDPOINT" --cli-connect-timeout 20 "$@"; }
          # size and key of every current object, tab between; the keys stay on the runner
          s3 list-objects-v2 --bucket "$BUCKET" --query 'Contents[].[Size,Key]' --output text > objects.tsv
          # a kind = the key with each id-like part (hex, digits, or 16+ characters) folded to *, the last part dropped
          # where it is one, so g18/blobs/<hash>/<n> counts as g*/blobs/*/*
          awk -F'\t' '
            function fold(k,   n, p, i, out, s) {
              n = split(k, p, "/"); out = ""
              for (i = 1; i <= n; i++) {
                s = p[i]
                if (s ~ /^g[0-9]+$/) s = "g*"
                else if (s ~ /^[0-9a-f]+$/ || s ~ /^[0-9]+$/ || length(s) >= 16 || s ~ /-/) s = "*"
                out = out (i > 1 ? "/" : "") s
              }
              return out
            }
            $2 != "" { k = fold($2); if (!(k in id)) { id[k] = ++N; print k > ("kind-" N) }
                       c[k]++; b[k] += $1; C++; B += $1; print $1 > ("sizes-" id[k]) }
            END {
              printf "%-36s %10s %14s %12s\n", "kind", "objects", "bytes", "mean bytes"
              for (k in c) printf "%-36s %10d %14d %12d\n", k, c[k], b[k], b[k] / c[k]
              printf "%-36s %10d %14d\n", "(all)", C, B
            }' objects.tsv | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '== spread of sizes per kind (min, p50, p90, max bytes)' | tee -a "$GITHUB_STEP_SUMMARY"
          for f in sizes-*; do
            sort -n "$f" | awk -v k="$(cat "kind-${f#sizes-}")" '{ a[NR] = $1 }
              END { printf "%-36s %10d %10d %10d %12d\n", k, a[1], a[int((NR + 1) / 2)], a[int(NR * 0.9) > 0 ? int(NR * 0.9) : 1], a[NR] }'
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Versions beside the current objects
        run: |
          s3() { aws s3api --endpoint-url "$S3_ENDPOINT" --cli-connect-timeout 20 "$@"; }
          s3 list-object-versions --bucket "$BUCKET" --output json \
            --query '{old: Versions[?IsLatest==`false`].Size, marks: length(DeleteMarkers || `[]`)}' > versions.json
          jq -r '"older versions kept: \(.old // [] | length) (\(.old // [] | add // 0) bytes); delete markers: \(.marks)"' \
            versions.json | tee -a "$GITHUB_STEP_SUMMARY"

  probe:
    if: ${{ inputs.step == 'probe' }}
    name: Probe conditional writes in avenDB's bucket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: If-None-Match and If-Match on one small object
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::set HETZNER_S3_ACCESS_KEY and HETZNER_S3_SECRET_KEY"; exit 1; }
          s3() { aws s3api --endpoint-url "$S3_ENDPOINT" --cli-connect-timeout 20 "$@"; }
          KEY="probe/${GITHUB_RUN_ID}/conditional"
          printf 'avenDB conditional-write probe %s\n' "$GITHUB_RUN_ID" > body
          MD5=$(openssl md5 -binary body | base64)
          # each try: what S3 said, in one word; a put without its condition is never sent
          try() { if OUT=$(s3 put-object --bucket "$BUCKET" --key "$KEY" --body body --content-md5 "$MD5" "$@" 2>&1); then
                    echo written; else printf '%s' "$OUT" | grep -o 'PreconditionFailed\|ConditionalRequestConflict\|NotImplemented\|InvalidArgument\|AccessDenied\|[0-9][0-9][0-9]' | head -n 1 || echo failed; fi; }
          first=$(try --if-none-match '*')
          again=$(try --if-none-match '*')
          ETAG=$(s3 head-object --bucket "$BUCKET" --key "$KEY" --query ETag --output text 2>/dev/null || true)
          wrong=$(try --if-match '"00000000000000000000000000000000"')
          right=skipped
          [ "$wrong" = PreconditionFailed ] && [ -n "$ETAG" ] && right=$(try --if-match "$ETAG")
          {
            echo "| try | expected if supported | Hetzner said |"
            echo "| --- | --- | --- |"
            echo "| If-None-Match: * on a new key | written | $first |"
            echo "| If-None-Match: * on the same key again | PreconditionFailed | $again |"
            echo "| If-Match with a wrong ETag | PreconditionFailed | $wrong |"
            echo "| If-Match with the current ETag | written | $right |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$again" = PreconditionFailed ] && [ "$wrong" = PreconditionFailed ] && [ "$right" = written ]; then
            echo "Conditional writes hold in this bucket: put-once and a writer guard can lean on them." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Conditional writes do not hold here: put-once stays read-then-write behind one writer."
          fi
