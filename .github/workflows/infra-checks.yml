name: Infrastructure contracts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['infra/**', '.bun-version', '.github/workflows/api.yml', '.github/workflows/infra-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
# a pull request's new push replaces its run
concurrency:
  group: infra-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: infra
      - run: bun --bun run check && bun smoke.mjs
        working-directory: infra
