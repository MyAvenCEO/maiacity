name: Infrastructure contracts
on:
  pull_request:
    paths: ['infra/**', '.bun-version', '.github/workflows/api.yml', '.github/workflows/infra-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: infra
      - run: bun --bun run check && bun smoke.mjs
        working-directory: infra
