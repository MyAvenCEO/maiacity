name: Site media check

# The site's media as everyone reads them (scripts/site-media-check.mjs): every file of the media manifest by its hash
# from api.maia.city/vault/files, which avenDB's feed answers (deploy/Caddyfile), read whole by ranges and hashed
# (BLAKE3), a picture asked whole too and a sound or a film from its middle. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read every file of the site's media
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun scripts/site-media-check.mjs
