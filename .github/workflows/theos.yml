# theOS's release (theOS/aip/aip-59ad.json, c1): the three checks production's ruleset requires, each from GitHub
# Actions and named exactly as the ruleset names them (d-c219: 'Only from main', 'avenSANDBOX', 'theOS'). On a pull request
# to production all three report; on a push to production 'avenSANDBOX' and 'theOS' run again on the commit that landed,
# so what is released is what was checked (d-4ca4: green is theOS's check inside the box on the commit released).
# The jobs never need one another: a job skipped because another failed would count as passed for a required check.
# No paths filter: a required check must report on every pull request. A draft runs nothing (the repository's rule);
# a draft can't merge, and marking it ready runs all three. Nothing here deploys yet (checkpoint 2).
# Actions are pinned by commit.
# production's pushes queue in one group: a newer push replaces a waiting one, so the newest commit, which holds every
# change before it, is the one checked (and, from checkpoint 2, deployed).
name: theOS

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]

permissions: {}

# a newer push to a pull request replaces its older run; production's pushes run one after another
concurrency:
  group: theos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  from-main:
    name: Only from main
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pull request comes from main of this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: theOS/release/from-main.sh

  box:
    name: avenSANDBOX
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: This commit's box is published for amd64 and arm64, and its tools answer
        run: theOS/release/box.sh

  check:
    name: theOS
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: theOS/sandbox/check.sh (theOS's check and its own test, inside the box)
        run: theOS/sandbox/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: theos-check-${{ github.sha }}
          path: theOS/avenCEO/checks/out/
          if-no-files-found: warn
          overwrite: true
