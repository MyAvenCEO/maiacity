# theOS's release (theOS/aip/aip-59ad.json, c1): the three checks production's ruleset requires, each from GitHub
# Actions and named exactly as the ruleset names them (d-c219: 'Only from main', 'avenSANDBOX', 'theOS'). On a pull request
# to production all three report; on a push to production 'avenSANDBOX' and 'theOS' run again on the commit that landed,
# so what is released is what was checked (d-4ca4: green is theOS's check inside the box on the commit released).
# The jobs never need one another: a job skipped because another failed would count as passed for a required check.
# The deploy (checkpoint 2) runs on a push to production after both checks are green, in the environment production
# (branch production only, d-f6da; d-06a8: a deploy starts by itself), and is the only job that reads a secret.
# No paths filter: a required check must report on every pull request. A draft runs nothing (the repository's rule);
# a draft can't merge, and marking it ready runs all three. # Actions are pinned by commit.
# production's pushes queue in one group: a newer push replaces a waiting one, so the newest commit, which holds every
# change before it, is the one checked (and, from checkpoint 2, deployed).
name: theOS

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]

permissions: {}

# a newer push to a pull request replaces its older run; production's pushes run one after another
concurrency:
  group: theos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  from-main:
    name: Only from main
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pull request comes from main of this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: theOS/release/from-main.sh

  box:
    name: avenSANDBOX
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: This commit's box is published for amd64 and arm64, and its tools answer
        run: theOS/release/box.sh

  check:
    name: theOS
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: theOS/sandbox/check.sh (theOS's check and its own test, inside the box)
        run: theOS/sandbox/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: theos-check-${{ github.sha }}
          path: theOS/avenCEO/checks/out/
          if-no-files-found: warn
          overwrite: true

  # theOS's deploy (c3, c5): the commit's theOS/ tree into its own folder on v1's server, the link switched, then the
  # health step: each page byte for byte the tree's, the Aven Peer's paths as before. Never a required check.
  deploy:
    name: Deploy to aven.maia.city
    needs: [box, check]
    if: github.event_name == 'push' && needs.box.result == 'success' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      SITE: aven.maia.city
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The switch (Gate B, Samuel's): the deploy is off until theOS/release/deploy.on holds the word on. Until then the
      # job reads no secret and touches no server: it says so and ends green.
      # A push that leaves theOS/ as it was deploys nothing, so an undo holds until theOS/ changes again (rv c2, 1).
      - name: Is the deploy on, and did theOS/ change?
        id: switch
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$(tr -d '[:space:]' < theOS/release/deploy.on 2> /dev/null)" != on ]; then
            echo "The deploy is off (theOS/release/deploy.on): nothing deployed. Gate B switches it on." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          now=$(git rev-parse HEAD:theOS)
          if [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git fetch -q --depth=1 origin "$BEFORE" && [ "$(git rev-parse "$BEFORE:theOS" 2> /dev/null)" = "$now" ]; then
            echo "theOS/ is as it was before this push: nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: SSH to the server, its host keys pinned
        if: steps.switch.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: theOS/release/ssh.sh "$SITE"
      - name: The Aven Peer's answers before
        if: steps.switch.outputs.go == 'true'
        run: theOS/release/health.sh before "https://$SITE" peer-before.txt
      - name: The tree, packed and deployed
        id: deploy
        if: steps.switch.outputs.go == 'true'
        shell: bash
        run: |
          tree=$(git rev-parse HEAD:theOS)
          git archive --format=tar.gz -o theos.tar.gz HEAD:theOS
          mkdir -p deployed && tar -xzf theos.tar.gz -C deployed
          ssh prod 'mkdir -p theos-release'
          scp -q theOS/release/deploy.sh theOS/release/undo.sh theos.tar.gz prod:theos-release/
          ssh prod "bash theos-release/deploy.sh $tree theos-release/theos.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY" deployed.txt
          grep -q ' is current (previous: ' deployed.txt && echo "switched=true" >> "$GITHUB_OUTPUT" || true
      - name: Health
        if: steps.switch.outputs.go == 'true'
        shell: bash
        run: |
          { echo "### aven.maia.city: theOS $(git rev-parse --short=12 HEAD:theOS) (commit ${GITHUB_SHA:0:12})"; echo
            theOS/release/health.sh after "https://$SITE" deployed peer-before.txt; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      # A deploy whose health is red goes back by itself to the build before (undo.sh: previous), so a failed release
      # never stays live; the job stays red.
      - name: Health was red, so back to the build before
        if: failure() && steps.deploy.outputs.switched == 'true'
        shell: bash
        run: |
          echo "::error::health is red after the deploy: switching back to the build before"
          ssh prod "bash theos-release/undo.sh /opt/maia-city/site/aven" | tee -a "$GITHUB_STEP_SUMMARY"
