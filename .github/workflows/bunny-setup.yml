name: Bunny setup

on:
  workflow_dispatch:
    inputs:
      inspect:
        description: Print edge scripting fields
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provision storage zone, pull zone, hostnames and stream library
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/bunny-setup.mjs

      - name: Set volume tier on CDN and stream
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/bunny-tier.mjs

      - name: Inspect edge scripting surface
        if: inputs.inspect
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/bunny-inspect.mjs
