# avenPEER's slim image, ghcr.io/myavenceo/aven/peer (aven/DB2/PRODUCTION.md, "The slim image"): the aven-peer
# binary built in the checkout's own box (by digest), copied onto a minimal base (aven/DB2/deploy/peer.Dockerfile).
# Built for amd64 and arm64, each on a runner of its own kind, and joined into one image tagged with a hash of its
# inputs (aven/DB2/deploy/tag.mjs): the same inputs are never built twice. The paths below are those inputs.
# avensandbox.yml calls it on a push to production, before it releases @aven/peer; on every other branch a push that
# changes an input builds it. Public, so the server pulls it without a token.
name: avenPEER image

on:
  push:
    branches-ignore: [production]
    paths:
      - aven/DB2/deploy/peer.Dockerfile
      - aven/DB2/deploy/peer.Dockerfile.dockerignore
      - aven/DB2/deploy/tag.mjs
      - aven/DB2/sandbox/box/**
      - aven/DB2/.dockerignore
      - aven/DB2/Cargo.toml
      - aven/DB2/Cargo.lock
      - aven/DB2/codec/**
      - aven/DB2/core/**
      - aven/DB2/gen1/**
      - aven/DB2/db/docs/**
      - aven/DB2/store/**
      - aven/DB2/id/core/**
      - aven/DB2/peer/wire/**
      - aven/DB2/peer/native/**
      - aven/DB2/peer/light/**
      - aven/runtimes/registry/**
      - .github/workflows/avenpeer-image.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: The image, name:tag, for both platforms
        value: ${{ jobs.plan.outputs.image }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    # the box's image is built beside it when a dependency moved: up to 30 minutes for it
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      image: ${{ steps.tag.outputs.image }}
      box: ${{ steps.box.outputs.box }}
      complete: ${{ steps.built.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The image's tag
        id: tag
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/peer"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:$(node aven/DB2/deploy/tag.mjs)" >> "$GITHUB_OUTPUT"
          node aven/DB2/deploy/tag.mjs --files
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Built for both platforms already?
        id: built
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          has=$(docker buildx imagetools inspect --raw "$IMAGE" 2>/dev/null \
            | jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | join(",")' || true)
          echo "$IMAGE has: ${has:-nothing yet}"
          if [ "$has" = "amd64,arm64" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; fi
      # The checkout's own box, by digest; avensandbox-image.yml may still be building it
      - name: The box it is built in
        id: box
        if: steps.built.outputs.complete != 'true'
        run: |
          box="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aven/sandbox:$(node aven/DB2/sandbox/box/tag.mjs)"
          for _ in $(seq 60); do
            has=$(docker buildx imagetools inspect --raw "$box" 2>/dev/null \
              | jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | join(",")' || true)
            [ "$has" = "amd64,arm64" ] && break
            echo "$box has ${has:-nothing} yet; waiting for avensandbox-image.yml"
            sleep 30
          done
          [ "$has" = "amd64,arm64" ] || { echo "::error::$box is not published for both platforms"; exit 1; }
          digest=$(docker buildx imagetools inspect "$box" --format '{{json .Manifest}}' | jq -r .digest)
          echo "box=${box%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "built in $box ($digest)"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.complete != 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          # aven/DB2, cut down by deploy/peer.Dockerfile.dockerignore to the workspace's crates
          context: aven/DB2
          # aven/runtimes' file registry, which the Peer takes by path, at /runtimes/registry
          build-contexts: registry=aven/runtimes/registry
          file: aven/DB2/deploy/peer.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BOX=${{ needs.plan.outputs.box }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.plan.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.plan.outputs.name }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.plan.outputs.name }}:cache-${{ matrix.arch }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: peer-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    name: One image for both platforms
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: peer-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the platforms under the image's tag
        working-directory: digests
        env:
          NAME: ${{ needs.plan.outputs.name }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          sources=()
          for d in *; do sources+=("$NAME@sha256:$d"); done
          docker buildx imagetools create --tag "$IMAGE" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE"
      # Its size: compressed, as a pull fetches it, per platform; and on disk, unpacked, for amd64
      - name: Measure it
        env:
          NAME: ${{ needs.plan.outputs.name }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "| platform | compressed (a pull) |"
            echo "| --- | --- |"
            for d in $(docker buildx imagetools inspect --raw "$IMAGE" | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture)=\(.digest)"'); do
              bytes=$(docker buildx imagetools inspect --raw "$NAME@${d#*=}" | jq '[.layers[].size] | add')
              echo "| ${d%%=*} | $(numfmt --to=iec --suffix=B "$bytes") ($bytes bytes) |"
            done
            docker pull -q --platform linux/amd64 "$IMAGE" > /dev/null
            echo
            echo "On disk (amd64): $(numfmt --to=iec --suffix=B "$(docker image inspect "$IMAGE" --format '{{.Size}}')")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
