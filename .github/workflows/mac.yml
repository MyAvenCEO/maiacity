name: theOS on macOS

# theOS (vault/app, Tauri) compiled on a Mac runner for every pull request that touches it or the avenDB device it
# embeds as a library, so a thread learns whether its Rust compiles here instead of
# queueing behind Samuel's Mac, where one Rust build runs at a time. A check only: it signs nothing and ships nothing;
# theOS itself is still built on the Mac (scripts/watch-main.mjs). The repository is public, so the runner is free.
# The Secure Enclave bridge needs macOS 26's SDK: where the runner's is older, build.rs builds without it and says so.
#
# On main too, after each merge that touches it: a pull request restores only the caches its base branch saved, so this
# keeps a warm one there (about 4 minutes warm against 16 cold).
on:
  pull_request:
    paths:
      - 'vault/app/**'
      - 'vault/crates/**'
      - 'vault/Cargo.toml'
      - 'vault/Cargo.lock'
      - 'avendb/crates/**'
      - 'avendb/Cargo.toml'
      - 'avendb/Cargo.lock'
      - '.github/workflows/mac.yml'
  push:
    branches: [main]
    paths:
      - 'vault/app/**'
      - 'vault/crates/**'
      - 'vault/Cargo.toml'
      - 'vault/Cargo.lock'
      - 'avendb/crates/**'
      - 'avendb/Cargo.toml'
      - 'avendb/Cargo.lock'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: read

# CI's own WebAssembly commit (avendb-wasm.yml) waits for the run in progress instead of cancelling it: theOS reads none
# of the WebAssembly, so its pass marker then lets that commit's run skip the build
concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}

jobs:
  # Pass marker (scripts/ci/passes.mjs, pull requests only): a build that passed on this PR with the same files is
  # skipped. The files: vault/, avenDB, and what their crates read from outside them (include_str!)
  passes:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.mac.outputs.cache-hit }}
      mac_key: ${{ steps.passes.outputs.mac_key }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: passes
        run: bun scripts/ci/passes.mjs "mac=vault,avendb,src/lib/models/models.json,src/lib/code/packages.json,game/film/grade-tools.json,tests/fixtures,.github/workflows/mac.yml"
      - id: mac
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pass
          key: ${{ steps.passes.outputs.mac_key }}
          lookup-only: true

  check:
    needs: passes
    if: needs.passes.outputs.mac != 'true'
    name: theOS compiles on macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      # The app workspace compiles the embedded avenDB crates into its own target directory.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: vault -> target
          cache-on-failure: true

      # tauri::generate_context! reads the site's build folder (tauri.conf.json frontendDist): the check needs it there,
      # not its contents
      - run: mkdir -p build && echo '<!doctype html>' > build/index.html

      - name: cargo check
        working-directory: vault
        run: cargo check --locked -p maiacity-studio

      - name: Media reference contract
        run: |
          rustc --edition=2024 --test vault/app/src/media_ref.rs -o "$RUNNER_TEMP/media-ref-tests"
          "$RUNNER_TEMP/media-ref-tests"

      - name: Native color and media contracts
        working-directory: vault
        run: cargo test --locked -p vault-color -p vault-media -p vault-asr
      - name: Render numerical contracts
        working-directory: vault
        run: cargo test --locked -p vault-render --test maths --test eq --test look --test creative

  # the marker saved on Linux, as it is looked up, so both agree on the cache's archive format
  passed:
    needs: [passes, check]
    if: github.event_name == 'pull_request' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo passed > .pass
      - uses: actions/cache/save@v6.1.0
        with:
          path: .pass
          key: ${{ needs.passes.outputs.mac_key }}
