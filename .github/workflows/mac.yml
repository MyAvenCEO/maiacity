name: theOS on macOS

# theOS (vault/app, Tauri) compiled on a Mac runner for every pull request that touches it or the avenDB device it
# bundles (build.rs builds avendb-device as its sidecar), so a thread learns whether its Rust compiles here instead of
# queueing behind Samuel's Mac, where one Rust build runs at a time. A check only: it signs nothing and ships nothing;
# theOS itself is still built on the Mac (scripts/watch-main.mjs). The repository is public, so the runner is free.
# The Secure Enclave bridge needs macOS 26's SDK: where the runner's is older, build.rs builds without it and says so.
#
# On main too, after each merge that touches it: a pull request restores only the caches its base branch saved, so this
# keeps a warm one there (about 4 minutes warm against 16 cold).
on:
  pull_request:
    paths:
      - 'vault/app/**'
      - 'vault/crates/**'
      - 'vault/Cargo.toml'
      - 'vault/Cargo.lock'
      - 'avendb/crates/**'
      - 'avendb/Cargo.toml'
      - 'avendb/Cargo.lock'
      - '.github/workflows/mac.yml'
  push:
    branches: [main]
    paths:
      - 'vault/app/**'
      - 'vault/crates/**'
      - 'vault/Cargo.toml'
      - 'vault/Cargo.lock'
      - 'avendb/crates/**'
      - 'avendb/Cargo.toml'
      - 'avendb/Cargo.lock'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: theOS compiles on macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # both workspaces: the app's, and avenDB's, where build.rs builds the sidecar (avendb/target)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vault -> target
            avendb -> target
          cache-on-failure: true

      # tauri::generate_context! reads the site's build folder (tauri.conf.json frontendDist): the check needs it there,
      # not its contents
      - run: mkdir -p build && echo '<!doctype html>' > build/index.html

      - name: cargo check
        working-directory: vault
        run: cargo check --locked -p maiacity-studio
