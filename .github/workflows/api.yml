name: API

# The signup service at api.maia.city. Runs only when something it depends on
# changes — a journal entry must never redeploy a server.
#
#   image  – build the api container, push to GHCR tagged with the commit
#   infra  – Pulumi: Hetzner server, volume, firewall (state in the `pulumi-state`
#            branch, so no Pulumi Cloud account is needed)
#   dns    – point api.maia.city and avendb.maia.city at the server (Hetzner DNS; skipped without a token)
#   deploy – over SSH: compose files + .env, then pull and up
#
# avenDB's server (avendb.maia.city) gets its settings, Caddy site and firewall port from here, and its image from
# avendb.yml, which builds and restarts it alone whenever its code changes: an avenDB change never restarts the API or
# the media vault, and a failed avenDB build never holds up their deploy.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'game/**'
      - 'infra/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
      - 'vault/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  APP_DIR: /opt/maia-city
  API_HOST: api.maia.city
  AVENDB_HOST: avendb.maia.city
  # Hetzner Object Storage: LIBRARY/ holds the media vault, BACKUPS/ the database dumps
  S3_BUCKET: maiacity
  S3_ENDPOINT: https://hel1.your-objectstorage.com
  S3_REGION: hel1

jobs:
  image:
    name: Build and push the API image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vault-image:
    name: Build and push the vault-server image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-vault" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: vault/Dockerfile.server
          push: true
          # Rust builds are slow: keep the layers between runs
          cache-from: type=gha,scope=vault
          cache-to: type=gha,scope=vault,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  infra:
    name: Hetzner (Pulumi)
    runs-on: ubuntu-latest
    outputs:
      ipv4: ${{ steps.out.outputs.ipv4 }}
      data_mount: ${{ steps.out.outputs.data_mount }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HETZNER_API_KEY }}
      # Encrypts the local Pulumi state that lives in the pulumi-state branch.
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
    steps:
      - name: Check the Pulumi passphrase is set
        run: |
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::Secret PULUMI_PASSPHRASE is missing — without it the Pulumi state cannot be read."; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: pulumi/actions@v6
      - name: Dependencies
        working-directory: infra
        run: bun install
      - name: Type check
        working-directory: infra
        run: bun run check
      - name: Derive the public deploy key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          echo "SSH_PUBLIC_KEY=$(ssh-keygen -y -f deploy_key)" >> "$GITHUB_ENV"
          rm deploy_key
      - name: Fetch the Pulumi state from the pulumi-state branch
        run: |
          if git fetch origin pulumi-state:pulumi-state 2>/dev/null; then
            git worktree add .pulumi-state pulumi-state
          else
            git worktree add --detach .pulumi-state
            git -C .pulumi-state checkout --orphan pulumi-state
            git -C .pulumi-state rm -rfq . || true
          fi
      - name: pulumi up
        working-directory: infra
        run: |
          pulumi login "file://$GITHUB_WORKSPACE/.pulumi-state"
          pulumi stack select prod --create
          pulumi up --yes --skip-preview --non-interactive
      - name: Outputs
        id: out
        working-directory: infra
        run: |
          pulumi login "file://$GITHUB_WORKSPACE/.pulumi-state" >/dev/null
          pulumi stack select prod
          echo "ipv4=$(pulumi stack output ipv4)" >> "$GITHUB_OUTPUT"
          echo "data_mount=$(pulumi stack output dataMount)" >> "$GITHUB_OUTPUT"
      - name: Write the Pulumi state back
        if: always()
        run: |
          cd .pulumi-state
          rm -rf .pulumi/backups
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=actions@github.com commit -qm "pulumi state ${GITHUB_SHA::7}"
            git push origin HEAD:pulumi-state
          fi

  dns:
    name: Point api.maia.city and avendb.maia.city at the server
    needs: infra
    runs-on: ubuntu-latest
    steps:
      # Hetzner DNS has its own API and its own token — the cloud token does not
      # open it. Without HETZNER_DNS_TOKEN the records have to be set by hand once,
      # and the rest of the pipeline carries on regardless.
      - name: Upsert the A records
        env:
          TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          IP: ${{ needs.infra.outputs.ipv4 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No HETZNER_DNS_TOKEN — add A records for $API_HOST and $AVENDB_HOST pointing at $IP by hand (Hetzner DNS console)."
            exit 0
          fi
          ZONE=$(curl -fsS -H "Auth-API-Token: $TOKEN" 'https://dns.hetzner.com/api/v1/zones?name=maia.city' | jq -r '.zones[0].id')
          [ -n "$ZONE" ] && [ "$ZONE" != null ] || { echo "::error::Zone maia.city not found under this DNS token."; exit 1; }
          for NAME in api avendb; do
            REC=$(curl -fsS -H "Auth-API-Token: $TOKEN" "https://dns.hetzner.com/api/v1/records?zone_id=$ZONE" \
                  | jq -r --arg n "$NAME" '.records[] | select(.type=="A" and .name==$n) | .id' | head -1)
            BODY=$(jq -nc --arg z "$ZONE" --arg v "$IP" --arg n "$NAME" '{zone_id:$z,type:"A",name:$n,value:$v,ttl:300}')
            if [ -n "$REC" ]; then
              curl -fsS -X PUT -H "Auth-API-Token: $TOKEN" -H 'Content-Type: application/json' \
                -d "$BODY" "https://dns.hetzner.com/api/v1/records/$REC" >/dev/null
              echo "A record updated: $NAME.maia.city -> $IP"
            else
              curl -fsS -X POST -H "Auth-API-Token: $TOKEN" -H 'Content-Type: application/json' \
                -d "$BODY" 'https://dns.hetzner.com/api/v1/records' >/dev/null
              echo "A record created: $NAME.maia.city -> $IP"
            fi
          done

  deploy:
    name: Roll out over SSH
    needs: [image, vault-image, infra, dns]
    runs-on: ubuntu-latest
    env:
      HOST: ${{ needs.infra.outputs.ipv4 }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # First contact with a freshly created server: take its host key.
          for i in $(seq 1 30); do ssh-keyscan -T 5 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n  ServerAliveCountMax 6\n' "$HOST" > ~/.ssh/config
      - name: Wait for cloud-init (is Docker there yet?)
        run: ssh prod 'sudo cloud-init status --wait >/dev/null || true; docker --version'
      - name: Mount the Hetzner volume (fstab by stable device id; automount is not reliable)
        env:
          DATA_MOUNT: ${{ needs.infra.outputs.data_mount }}
        run: |
          ssh prod "bash -s" <<EOS
          set -e
          M="$DATA_MOUNT"; DEV="/dev/disk/by-id/scsi-0HC_Volume_\${M##*_}"
          if ! mountpoint -q "\$M"; then
            sudo mkdir -p "\$M"
            grep -q "\$DEV" /etc/fstab || echo "\$DEV \$M ext4 discard,nofail,defaults 0 0" | sudo tee -a /etc/fstab >/dev/null
            sudo systemctl daemon-reload
            sudo mount "\$M"
          fi
          mountpoint "\$M" && df -h "\$M" | tail -1
          EOS
      - name: Copy the compose files
        run: |
          # site/ before compose mounts it (Docker would make it root's); the site workflow fills it
          ssh prod "mkdir -p $APP_DIR/deploy $APP_DIR/site/releases"
          scp docker-compose.yml docker-compose.prod.yml prod:$APP_DIR/
          scp deploy/Caddyfile deploy/backup.sh prod:$APP_DIR/deploy/
      - name: Write .env (the database password is generated once and stays on the server)
        env:
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          VAULT_IMAGE: ${{ needs.vault-image.outputs.image }}:${{ github.sha }}
          DATA_MOUNT: ${{ needs.infra.outputs.data_mount }}
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          # speech to text (Prem, Deepgram Nova 3): only the API container gets it — never a Mac
          PREMAI_API_KEY: ${{ secrets.PREMAI_API_KEY }}
          # avenDB's server: the one-time code the first human vault brings to claim it (avendb/README.md)
          AVENDB_SETUP_CODE: ${{ secrets.AVENDB_SETUP_CODE }}
        run: |
          [ -n "$PREMAI_API_KEY" ] || echo "::notice::No PREMAI_API_KEY — recordings get no transcripts until it is set."
          # the setup code goes through the script below and compose's .env, so plain characters only; never echoed
          RE='^[A-Za-z0-9._~+/=-]{20,}$'
          if [ -z "$AVENDB_SETUP_CODE" ]; then
            echo "::notice::No AVENDB_SETUP_CODE — nobody can claim avenDB's server until it is set."
          elif ! [[ $AVENDB_SETUP_CODE =~ $RE ]]; then
            echo "::warning::AVENDB_SETUP_CODE is left out: it takes 20 or more letters and digits (and . _ ~ + / = -)."
            AVENDB_SETUP_CODE=
          fi
          ssh prod "cd $APP_DIR && bash -s" <<EOS
          set -e
          # avendb.yml writes AVENDB_IMAGE here too: one writer at a time
          exec 9>.env.lock; flock 9
          # Postgres keeps this password inside its own data directory, so it is
          # created once next to that data and never rotated automatically.
          PWFILE="$DATA_MOUNT/.postgres_password"
          if [ ! -f "\$PWFILE" ]; then
            if [ -f .env ] && grep -q '^POSTGRES_PASSWORD=' .env; then
              grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- | sudo tee "\$PWFILE" >/dev/null
            else
              openssl rand -hex 24 | sudo tee "\$PWFILE" >/dev/null
            fi
            sudo chown deploy "\$PWFILE"; sudo chmod 600 "\$PWFILE"
          fi
          PW=\$(cat "\$PWFILE")
          # avenDB's image is avendb.yml's to set: kept as it is, and its server runs once there is one
          AVI=\$(grep '^AVENDB_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)
          PROFILES="${S3_ACCESS_KEY:+vault}"
          if [ -n "\$AVI" ]; then PROFILES="\${PROFILES:+\$PROFILES,}avendb"; fi
          cat > .env <<EOF2
          POSTGRES_DB=maiacity
          POSTGRES_USER=maiacity
          POSTGRES_PASSWORD=\$PW
          PGDATA_PATH=$DATA_MOUNT/postgres
          API_IMAGE=$IMAGE
          API_ADDRESS=$API_HOST
          RP_ID=maia.city
          RP_NAME=maiaCITY
          SITE_ORIGIN=https://maia.city,https://www.maia.city
          COOKIE_DOMAIN=.maia.city
          VAULT_IMAGE=$VAULT_IMAGE
          VAULT_PUBLIC_IP=$HOST
          VAULT_RELAY_URL=https://$API_HOST
          S3_ENDPOINT=$S3_ENDPOINT
          S3_REGION=$S3_REGION
          S3_BUCKET=$S3_BUCKET
          S3_ACCESS_KEY=$S3_ACCESS_KEY
          S3_SECRET_KEY=$S3_SECRET_KEY
          PREMAI_API_KEY=$PREMAI_API_KEY
          AVENDB_IMAGE=\$AVI
          AVENDB_ADDRESS=$AVENDB_HOST
          AVENDB_RELAY_URL=https://$AVENDB_HOST
          AVENDB_PUBLIC_ADDR=$HOST:7401
          AVENDB_DATA_PATH=$DATA_MOUNT/avendb
          AVENDB_SETUP_CODE=$AVENDB_SETUP_CODE
          COMPOSE_PROFILES=\$PROFILES
          EOF2
          chmod 600 .env
          sudo mkdir -p "$DATA_MOUNT/postgres" "$DATA_MOUNT/avendb"
          EOS
      - name: Rotate SSH keys (if set, exactly this list is authorised)
        env:
          AUTHORIZED_KEYS: ${{ secrets.DEPLOY_SSH_AUTHORIZED_KEYS }}
        run: |
          if [ -n "$AUTHORIZED_KEYS" ]; then
            printf '%s\n' "$AUTHORIZED_KEYS" | ssh prod 'umask 077; cat > ~/.ssh/authorized_keys.new && mv ~/.ssh/authorized_keys.new ~/.ssh/authorized_keys'
          fi
      # Before anything changes: the database goes to the bucket (BACKUPS/pg/). The same script runs daily at
      # 03:15 UTC from cron; dumps expire after 30 days. Skipped, with a notice, while the S3 secrets are missing.
      - name: Back up the database
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "::notice::No database backup: set HETZNER_S3_ACCESS_KEY and HETZNER_S3_SECRET_KEY."; exit 0
          fi
          # the keys travel over stdin into a file only deploy can read — never as arguments
          printf 'BACKUP_BUCKET=%s\nBACKUP_ENDPOINT=%s\nBACKUP_REGION=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' \
            "$S3_BUCKET" "$S3_ENDPOINT" "$S3_REGION" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" \
            | ssh prod "umask 077; cat > $APP_DIR/backup.env"
          ssh prod "bash -s" <<EOS
          set -e
          chmod +x $APP_DIR/deploy/backup.sh
          # daily, 03:15 UTC
          echo '15 3 * * * deploy bash $APP_DIR/deploy/backup.sh daily --no-media >> /var/log/maia-city-backup.log 2>&1' \
            | sudo tee /etc/cron.d/maia-city-backup >/dev/null
          sudo touch /var/log/maia-city-backup.log && sudo chown deploy /var/log/maia-city-backup.log
          # keep 30 days of dumps; nothing outside BACKUPS/pg/ ever expires (LIBRARY/ is the vault)
          set -a; . $APP_DIR/backup.env; set +a
          timeout 120 docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION="\$BACKUP_REGION" \
            -e AWS_REQUEST_CHECKSUM_CALCULATION=when_required -e AWS_RESPONSE_CHECKSUM_VALIDATION=when_required \
            amazon/aws-cli --endpoint-url "\$BACKUP_ENDPOINT" --cli-connect-timeout 20 s3api put-bucket-lifecycle-configuration --bucket "\$BACKUP_BUCKET" \
            --lifecycle-configuration '{"Rules":[{"ID":"pg-dumps-30-days","Status":"Enabled","Filter":{"Prefix":"BACKUPS/pg/"},"Expiration":{"Days":30}}]}' \
            </dev/null && echo "backup: 30-day rule on BACKUPS/pg/ is set" \
            || echo "::warning::The 30-day rule for BACKUPS/pg/ could not be set; dumps are kept until it is."
          EOS
          # its own SSH call with no input: nothing in the backup can wait for the rest of a script on stdin.
          # A failed backup is a warning, not a stopped release — the next deploy and the daily run try again.
          ssh prod "timeout 900 bash $APP_DIR/deploy/backup.sh before-deploy-${GITHUB_SHA::7} --no-media </dev/null" \
            || echo "::warning::The database backup before this deploy failed — see the step's log."
      - name: Update the containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes to the server over stdin, never as a process argument.
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh prod "cd $APP_DIR
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull -q
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            # a running Caddy keeps its old routes until told: read the Caddyfile again
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker logout ghcr.io >/dev/null
            docker image prune -f >/dev/null"
      - name: The vault server (when it runs)
        run: |
          sleep 5
          ssh prod "cd $APP_DIR && docker compose -f docker-compose.yml -f docker-compose.prod.yml ps vault && docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 20 vault" || true
          curl -fsS "https://$API_HOST/vault/health" && echo " ← the vault gateway answers" || echo "::warning::the vault gateway does not answer yet"
      # avenDB's server comes up with its first image from avendb.yml; from then on every deploy here keeps it running
      - name: avenDB's server (when it runs)
        run: |
          if ! ssh prod "docker ps -q --filter name=^maia-city-avendb$ --filter status=running" | grep -q .; then
            echo "::notice::avenDB's server is not running yet: the avenDB workflow (avendb.yml) builds and starts it."; exit 0
          fi
          # its device, endpoint and offer, all public; its setup code is never logged
          ssh prod "docker logs maia-city-avendb 2>&1" | grep 'avenDB server:' | tail -4 || true
          ssh prod "docker exec maia-city-caddy wget -qO- http://avendb:3350/healthz" && echo " ← its relay answers inside" \
            || echo "::warning::avenDB's relay does not answer inside"
          curl -fsS "https://$AVENDB_HOST/healthz" && echo " ← https://$AVENDB_HOST answers" \
            || echo "::warning::https://$AVENDB_HOST does not answer yet — check its A record (-> $HOST) and let Caddy finish its certificate."
      # Health is judged on the server, not through DNS: a missing A record must
      # not make a good deploy look broken.
      - name: Health check (on the server)
        run: |
          for i in $(seq 1 30); do
            if ssh prod "cd $APP_DIR && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api \
                 bun -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" 2>/dev/null; then
              echo "api is healthy on the server"; exit 0
            fi
            sleep 5
          done
          ssh prod "cd $APP_DIR && docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 api"
          exit 1
      # And then through the front door, which also needs DNS and a certificate.
      # Warn rather than fail: the first certificate takes a moment, and without
      # a DNS token the record is still a manual step.
      - name: Reachable from outside?
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "https://$API_HOST/api/health" >/dev/null; then echo "OK: https://$API_HOST"; exit 0; fi
            sleep 5
          done
          echo "::warning::https://$API_HOST is not answering yet — check the A record and let Caddy finish its certificate."
