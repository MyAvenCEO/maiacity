name: API contracts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: The API's tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      # the tests import game/ and scripts/ (the root's packages) and the API's own (its Postgres, PGlite)
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: api
      - run: bun test ./api/test

