name: Build release image
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
    outputs:
      image:
        value: ${{ jobs.image.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: meta
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            api) CONTEXT=.; FILE=api/Dockerfile ;;
            avendb) CONTEXT=avendb; FILE=avendb/Dockerfile.server ;;
            *) echo 'Unknown release component' >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # avenDB's server: the image server-prebuild.yml built from these very avendb/ files while the pull request ran,
      # promoted only with its signature from that workflow on main; anything else (none there, another signer, a
      # different tree) builds here as before
      - id: prebuilt
        if: inputs.component == 'avendb'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          tree=$(git rev-parse HEAD:avendb)
          ref="$IMAGE:tree-$tree"
          if ! docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "No image built ahead for avendb/ $tree: building it"; exit 0
          fi
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          if gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/server-prebuild.yml" --source-ref refs/heads/main \
              --deny-self-hosted-runners --bundle-from-oci > /dev/null; then
            docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE@$digest"
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Promoted $IMAGE@$digest, built ahead from avendb/ $tree and signed by server-prebuild.yml on main"
          else
            echo "::warning::$ref is not signed by server-prebuild.yml on main: building it here"
          fi
      - if: steps.prebuilt.outputs.promoted != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          push: true
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,scope=${{ inputs.component }},mode=max
          # Parallel builds are candidates; never advance a mutable release tag before validation.
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
