name: Build release image
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
    outputs:
      image:
        value: ${{ jobs.image.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: meta
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            api) CONTEXT=.; FILE=api/Dockerfile ;;
            avendb) CONTEXT=avendb; FILE=avendb/Dockerfile.server ;;
            *) echo 'Unknown release component' >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          push: true
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,scope=${{ inputs.component }},mode=max
          # Parallel builds are candidates; never advance a mutable release tag before validation.
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
