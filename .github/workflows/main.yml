name: Validate and release

# Each required suite runs once on the actual main commit's files. Calls never trust a cache as validation. A suite runs
# again here unless the merged pull request's own run of it passed on byte-for-byte these files (scripts/ci/reuse.mjs:
# same tree, a head that holds main's parent, the latest run of that workflow green); then the release does not wait.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-release
  cancel-in-progress: false
jobs:
  impact:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.paths.outputs.full_validation }}
      site: ${{ steps.paths.outputs.site }}
      api: ${{ steps.paths.outputs.api }}
      avendb: ${{ steps.paths.outputs.avendb }}
      server: ${{ steps.paths.outputs.server }}
      agent: ${{ steps.paths.outputs.agent }}
      infra: ${{ steps.paths.outputs.infra }}
      browser: ${{ steps.paths.outputs.browser }}
      protocol: ${{ steps.paths.outputs.protocol }}
      reuse_kernel: ${{ steps.paths.outputs.reuse_kernel }}
      reuse_avendb: ${{ steps.paths.outputs.reuse_avendb }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          CI_BASE=$(bun scripts/ci/release-base.mjs)
          export CI_BASE
          bun scripts/ci/impact.mjs
          bun scripts/ci/reuse.mjs
  site-build:
    needs: impact
    if: needs.impact.outputs.site == 'true'
    uses: ./.github/workflows/site-build.yml
    with:
      typechecked_elsewhere: true
  api-image:
    needs: impact
    if: needs.impact.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      component: api
  server-image:
    needs: impact
    if: needs.impact.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      component: avendb
  kernel:
    needs: impact
    if: needs.impact.outputs.site == 'true' && needs.impact.outputs.reuse_kernel != 'true'
    uses: ./.github/workflows/kernel.yml
    with:
      full: ${{ needs.impact.outputs.full_validation == 'true' }}
  api-tests:
    needs: impact
    if: needs.impact.outputs.api == 'true' && needs.impact.outputs.site != 'true'
    uses: ./.github/workflows/api-tests.yml
  avendb:
    needs: impact
    if: (needs.impact.outputs.avendb == 'true' || needs.impact.outputs.server == 'true' || needs.impact.outputs.agent == 'true') && needs.impact.outputs.reuse_avendb != 'true'
    uses: ./.github/workflows/avendb-checks.yml
    with:
      full: ${{ needs.impact.outputs.full_validation == 'true' }}
      real_browser: ${{ needs.impact.outputs.browser == 'true' }}
      protocol: ${{ needs.impact.outputs.protocol == 'true' }}
  delivery:
    needs: impact
    if: needs.impact.outputs.api == 'true' || needs.impact.outputs.server == 'true'
    uses: ./.github/workflows/delivery-checks.yml
  site:
    needs: [impact, kernel, site-build]
    if: ${{ !cancelled() && needs.impact.outputs.site == 'true' && needs.site-build.result == 'success' && (needs.kernel.result == 'success' || (needs.kernel.result == 'skipped' && needs.impact.outputs.reuse_kernel == 'true')) }}
    uses: ./.github/workflows/deploy.yml
    with:
      validated: true
      built: true
    secrets: inherit
  api:
    needs: [impact, kernel, api-tests, delivery, api-image]
    if: ${{ !cancelled() && needs.impact.outputs.api == 'true' && needs.delivery.result == 'success' && needs.api-image.result == 'success' && ((needs.impact.outputs.site == 'true' && needs.api-tests.result == 'skipped' && (needs.kernel.result == 'success' || (needs.kernel.result == 'skipped' && needs.impact.outputs.reuse_kernel == 'true'))) || (needs.impact.outputs.site != 'true' && needs.kernel.result == 'skipped' && needs.api-tests.result == 'success')) }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/api.yml
    with:
      validated: true
      built_image: ${{ needs.api-image.outputs.image }}
      reconcile_infra: ${{ needs.impact.outputs.infra == 'true' }}
    secrets: inherit
  server:
    needs: [impact, avendb, delivery, server-image]
    if: ${{ !cancelled() && needs.impact.outputs.server == 'true' && needs.delivery.result == 'success' && needs.server-image.result == 'success' && (needs.avendb.result == 'success' || (needs.avendb.result == 'skipped' && needs.impact.outputs.reuse_avendb == 'true')) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/avendb.yml
    with:
      validated: true
      built_image: ${{ needs.server-image.outputs.image }}
    secrets: inherit
  # the cloud agent's build (7-13 min) runs as its own workflow, so the release, and the next merge's release queued
  # behind it, need not wait for it; it builds this very commit and its group keeps only the newest
  agent:
    needs: [impact, avendb]
    if: ${{ !cancelled() && needs.impact.outputs.agent == 'true' && (needs.avendb.result == 'success' || (needs.avendb.result == 'skipped' && needs.impact.outputs.reuse_avendb == 'true')) }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avendb-agent.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$GITHUB_SHA" -f validated=true

  # A pull request restores only the Rust caches main saved, and main saves them only when it runs the avenDB checks.
  # With their results reused, main runs none, so when what those caches hold changes (the dependencies, the
  # toolchain, the checks' own jobs), main runs the checks once more, after the release and outside its lock, to
  # save caches pull requests can start warm from.
  warm:
    needs: impact
    if: needs.impact.outputs.reuse_avendb == 'true'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
          if grep -qE '^(avendb/(Cargo\.lock|Cargo\.toml|rust-toolchain|\.cargo/|crates/[^/]+/Cargo\.toml)|\.github/workflows/avendb-checks\.yml$)' <<< "$files"; then
            gh workflow run avendb-checks.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "::notice::the avenDB checks run on main to save warm caches"
          fi
