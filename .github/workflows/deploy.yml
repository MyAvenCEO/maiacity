name: Deploy the site

# maia.city is served by Bunny: the built site goes to the Bunny storage zone behind its CDN.
# (GitHub Pages used to get a copy too; nothing points at it any more.)
# The Media workflow dispatches this again after it has moved new files into the media library,
# so the site picks up their CDN addresses.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  bunny:
    name: Check, build and upload to Bunny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      # every journal image from its CID on the CDN; stops if one was never synced to the library
      - run: node scripts/media-manifest.mjs

      # Served from the domain root, so no base path.
      - run: bun run build

      - name: Upload to Bunny storage and purge
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node scripts/bunny-deploy.mjs
