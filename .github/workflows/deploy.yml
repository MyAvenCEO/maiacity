name: Deploy the site

# maia.city is served by our own server: its Caddy serves the built site from /opt/maia-city/site (and the API, and the
# site's media from avenDB's feed). Each build goes up beside the last and a link switches to it, so a page never points
# at chunks that are gone; the last few builds stay for a quick way back. Media never ships with the site: every file
# comes from avenDB's feed (api.maia.city/vault/files) by its BLAKE3 hash. maia.city and www point at the server (A
# records, Hetzner DNS).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

env:
  APP_DIR: /opt/maia-city
  SITE: maia.city
  API_HOST: api.maia.city

jobs:
  # the kernel gate (kernel.yml): its tests and both probes, in Chromium and in WebKit; nothing goes on the server unless they pass
  kernel:
    name: Kernel
    uses: ./.github/workflows/kernel.yml

  # checked and built beside the kernel gate, not after it: the build waits for nothing, and only `site` below, which
  # puts it on the server, waits for the gate
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check

      # stops if a published post names a file the site's media list (src/lib/media/manifest.json) does not hold
      - run: node scripts/media-manifest.mjs

      # Served from the domain root, so no base path.
      - run: bun run build

      # the release list (scripts/release.mjs): the commit and the hash of every file built, up as /release.json, which
      # a Mac of Maia City witnesses and proposes into Maia City for its owners to accept
      - run: node scripts/release.mjs list build

      - run: tar -C build -czf site.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tgz
          retention-days: 1
          compression-level: 0

  site:
    name: Put on the server
    # nothing goes on the server unless the kernel gate passed, and the build that goes is this commit's
    needs: [kernel, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Prepare SSH
        run: |
          HOST=$(getent hosts "$API_HOST" | awk '{print $1}' | head -1)
          [ -n "$HOST" ] || { echo "::error::$API_HOST does not resolve"; exit 1; }
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' "$HOST" > ~/.ssh/config

      - name: Put the build on the server and switch to it
        run: |
          ssh prod "mkdir -p $APP_DIR/site/releases/$GITHUB_SHA"
          ssh prod "tar -xzf - -C $APP_DIR/site/releases/$GITHUB_SHA" < site.tgz
          ssh prod "bash -s" <<EOS
          set -e
          cd $APP_DIR/site
          # a relative link: it resolves the same inside Caddy's container
          ln -sfn releases/$GITHUB_SHA current.next && mv -Tf current.next current
          # the newest five builds stay
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
          echo "live: \$(readlink current) · \$(ls releases | wc -l) builds kept"
          EOS

      - name: Through the front door (HTTPS from the server)
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE/" || true)
            [ "$CODE" = "200" ] && { echo "https://$SITE/ answers 200 from the server"; exit 0; }
            sleep 10
          done
          echo "::warning::https://$SITE/ does not answer 200 yet — check the caddy log (the certificate)."
