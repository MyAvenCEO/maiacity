name: Deploy the site

# maia.city is served by our own server: its Caddy serves the built site from /opt/maia-city/site (and the API, and the
# site's media from avenDB's feed). Each build goes up beside the last and a link switches to it, so a page never points
# at missing chunks: their immutable assets are published at shared URLs before the switch. Five builds stay for a
# quick way back; their chunks stay for at least 30 days for open pages. Media never ships with the site: every file
# comes from avenDB's feed (api.maia.city/vault/files) by its BLAKE3 hash. maia.city and www point at the server (A
# records, Hetzner DNS).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

env:
  APP_DIR: /opt/maia-city
  SITE: maia.city
  API_HOST: api.maia.city

jobs:
  # the kernel gate (kernel.yml): its tests and both probes, in Chromium and in WebKit; nothing goes on the server unless they pass
  kernel:
    name: Kernel
    uses: ./.github/workflows/kernel.yml

  # checked and built beside the kernel gate, not after it: the build waits for nothing, and only `site` below, which
  # puts it on the server, waits for the gate
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Check release retention and actual Caddy routing
        run: |
          mkdir -p "$RUNNER_TEMP/site-caddy"
          docker run --rm -v "$RUNNER_TEMP/site-caddy:/out" --entrypoint cp caddy:2-alpine /usr/bin/caddy /out/caddy
          CADDY="$RUNNER_TEMP/site-caddy/caddy" python3 -m unittest discover -s deploy -p 'test_publish_site.py' -v

      - run: bun run check

      # stops if a published post names a file the site's media list (src/lib/media/manifest.json) does not hold
      - run: node scripts/media-manifest.mjs

      # Served from the domain root, so no base path.
      # Vite on Bun, as a Mac of Maia City builds it to witness this release (scripts/release.mjs): Vite on Node lays
      # out other bytes
      - run: bun --bun run build

      # the release list (scripts/release.mjs): the commit and the hash of every file built, up as /release.json, which
      # a Mac of Maia City witnesses and proposes into Maia City for its owners to accept
      - run: node scripts/release.mjs list build

      - run: tar -C build -czf site.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tgz
          retention-days: 1
          compression-level: 0

  site:
    name: Put on the server
    # nothing goes on the server unless the kernel gate passed, and the build that goes is this commit's
    needs: [kernel, build]
    runs-on: ubuntu-latest
    steps:
      # the server's own action (.github/actions/prod-ssh): its host keys pinned, never taken on trust
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            deploy
      - uses: ./.github/actions/prod-ssh
        with:
          host: ${{ env.API_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # after the checkout, which empties the workspace
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Validate and activate the immutable asset route
        run: |
          # Fail before changing routing if the publisher's standard-library runtime is absent.
          ssh prod "python3 --version && mkdir -p '$APP_DIR/site/releases'"
          # The candidate is outside every public file root. Validate with the running
          # container's actual modules and environment before updating its bound file.
          scp deploy/Caddyfile "prod:$APP_DIR/site/.Caddyfile-$GITHUB_SHA"
          ssh prod "bash -s -- '$APP_DIR' '$GITHUB_SHA'" <<'SH'
          set -euo pipefail
          site_root="$1/site"
          config="$1/deploy/Caddyfile"
          candidate="$site_root/.Caddyfile-$2"
          digest=$(sha256sum "$candidate" | cut -d ' ' -f 1)
          applied="$site_root/.caddy-applied"
          # Reusing unchanged routes avoids reconnecting relay WebSockets on every site deploy.
          # Record only a successful reload: an interrupted/failed attempt is retried next time.
          if cmp -s "$candidate" "$config" && [ "$(cat "$applied" 2>/dev/null || true)" = "$digest" ]; then
            rm "$candidate"
            exit 0
          fi
          docker exec maia-city-caddy caddy validate --config "/srv/site/.Caddyfile-$2" --adapter caddyfile
          # Preserve the inode mounted into the running container.
          cat "$candidate" > "$config"
          docker exec maia-city-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          printf '%s\n' "$digest" > "$applied.next"
          mv -f "$applied.next" "$applied"
          rm "$candidate"
          SH

      - name: Put the build on the server and switch to it
        run: |
          ssh prod "mkdir -p $APP_DIR/site/releases/$GITHUB_SHA"
          ssh prod "tar -xzf - -C $APP_DIR/site/releases/$GITHUB_SHA" < site.tgz
          # Python's standard library publishes complete immutable assets, then switches the
          # relative current symlink atomically and applies the five-release cleanup window.
          ssh prod "python3 - '$APP_DIR/site' '$GITHUB_SHA'" < deploy/publish-site.py

      - name: Through the front door (HTTPS from the server)
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE/" || true)
            [ "$CODE" = "200" ] && { echo "https://$SITE/ answers 200 from the server"; exit 0; }
            sleep 10
          done
          echo "::warning::https://$SITE/ does not answer 200 yet — check the caddy log (the certificate)."
