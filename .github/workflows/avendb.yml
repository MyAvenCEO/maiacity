name: avenDB server

# avenDB's server at avendb.maia.city (avendb/crates/avendb-server): built from avendb/ alone and rolled out on its own,
# so a change to avenDB never restarts the API or the media vault, and a failed avenDB build never holds up theirs.
#
#   image  – build the server's image (avendb/Dockerfile.server), push to GHCR tagged with the commit
#   checks – avenDB's tests and Lean spec (avendb-checks.yml), on this commit
#   deploy – once both passed, over SSH: AVENDB_IMAGE, its bucket's settings and its bucket of snapshots into the server's .env, then pull
#            and restart this one container
#   bucket – make sure avenDB's own bucket is there (BUCKET in hel1, beside the media vault's), with Object Lock
#
# The bucket gets Object Lock as it is made, as no bucket can get it later, and so keeps versioning on for good. Every
# object version is locked in compliance mode for 7 days: no key, not even the project's, deletes or overwrites it
# before then. A replaced or deleted version goes 7 days later, an unfinished upload after 2. The bucket is made with
# the project's S3 keys (HETZNER_S3_*), which the API and its backups use too.
#
# Its settings (host name, data folder), its Caddy site and its firewall port come from the API workflow
# (api.yml), which also makes the server: that has to have run once before this can roll out.
on:
  workflow_call:
    inputs:
      built_image:
        description: Image repository built for this SHA in this main run
        type: string
        default: ''
      validated:
        description: The trusted main pipeline already checked this exact commit
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: avendb
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP_DIR: /opt/maia-city
  API_HOST: api.maia.city
  AVENDB_HOST: avendb.maia.city
  BUCKET: maiacity-avendb
  # its bucket of snapshots, which avendb-backups.yml makes
  SNAPSHOTS: maiacity-avendb-snapshots
  S3_ENDPOINT: https://hel1.your-objectstorage.com
  S3_REGION: hel1

jobs:
  image:
    if: ${{ inputs.built_image == '' }}
    uses: ./.github/workflows/image.yml
    with:
      component: avendb

  # avenDB's checks (avendb-checks.yml): its Rust tests and its Lean spec, on this very commit, beside the image's
  # build; nothing goes on the server unless they pass
  checks:
    if: ${{ !inputs.validated }}
    name: avenDB checks
    uses: ./.github/workflows/avendb-checks.yml

  delivery:
    if: ${{ !inputs.validated }}
    uses: ./.github/workflows/delivery-checks.yml

  deploy:
    concurrency:
      group: maia-production-containers
      cancel-in-progress: false
    name: Restart avenDB's server over SSH
    needs: [image, checks, delivery]
    if: ${{ !cancelled() && (needs.image.result == 'success' || (inputs.validated && inputs.built_image != '' && needs.image.result == 'skipped')) && (needs.checks.result == 'success' || (inputs.validated && needs.checks.result == 'skipped')) && (needs.delivery.result == 'success' || (inputs.validated && needs.delivery.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      # the server's own action (.github/actions/prod-ssh): its host keys pinned, never taken on trust
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            deploy
      - uses: ./.github/actions/prod-ssh
        with:
          host: ${{ env.API_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Prepare the close gate
        run: |
          ssh prod "python3 --version && mkdir -p '$APP_DIR/deploy'"
          scp deploy/stop-avendb.py "prod:$APP_DIR/deploy/stop-avendb-$GITHUB_SHA.py"
      - name: Roll out the new image
        env:
          IMAGE: ${{ inputs.built_image || needs.image.outputs.image }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          # the server's bucket (blobs B3a): its store lives there, every object sealed under AVENDB_BUCKET_SEAL
          BUCKET_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          BUCKET_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          BUCKET_SEAL: ${{ secrets.AVENDB_BUCKET_SEAL }}
        run: |
          # The token goes to the server over stdin, never as a process argument.
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          # The bucket's settings, every secret set, or no deploy at all: a server started without its bucket would be a
          # new, empty device on its volume, every app cut off from Maia City (Samuel 2026-10-19: "so no accidental
          # resets can happen anymore"). They go to the server over stdin too, and never into the log.
          if [ -z "$BUCKET_ACCESS_KEY" ] || [ -z "$BUCKET_SECRET_KEY" ] || [ -z "$BUCKET_SEAL" ]; then
            echo "::error::No bucket for avenDB's server: set HETZNER_S3_ACCESS_KEY, HETZNER_S3_SECRET_KEY and AVENDB_BUCKET_SEAL. Nothing was deployed."
            exit 1
          fi
          # and its bucket of snapshots (avendb/docs/BACKUP.md, avendb-backups.yml), at the same endpoint with the same key
          # and seal: every vault backed up into it each day at 03:00 UTC, then checked
          BUCKET_ENV=$(printf 'AVENDB_BUCKET=%s\nAVENDB_BUCKET_ENDPOINT=%s\nAVENDB_BUCKET_REGION=%s\nAVENDB_BUCKET_ACCESS_KEY=%s\nAVENDB_BUCKET_SECRET_KEY=%s\nAVENDB_BUCKET_SEAL=%s\nAVENDB_SNAPSHOTS=%s' \
            "$BUCKET" "$S3_ENDPOINT" "$S3_REGION" "$BUCKET_ACCESS_KEY" "$BUCKET_SECRET_KEY" "$BUCKET_SEAL" "$SNAPSHOTS")
          ssh prod "cd $APP_DIR && bash -s" <<EOS
          set -e
          # api.yml rewrites this .env too: one writer at a time
          exec 9>.env.lock; flock -w 300 9
          # Pull first; a registry failure must not stop the running device.
          docker pull --quiet "$IMAGE"
          # The child owns close independently of this SSH/CI observer and retains fd 9.
          # A failed/expired monitor exits before changing config or starting a writer.
          python3 "deploy/stop-avendb-$GITHUB_SHA.py" "$APP_DIR" --lock-fd 9 --wait 300
          grep -q '^AVENDB_DATA_PATH=' .env 2>/dev/null \
            || { echo "::error::$APP_DIR/.env has no avenDB settings yet: run the API workflow (api.yml) first."; exit 1; }
          sed -i '/^AVENDB_IMAGE=/d' .env && echo "AVENDB_IMAGE=$IMAGE" >> .env
          sed -i '/^AVENDB_BUCKET/d; /^AVENDB_SNAPSHOTS=/d' .env
          cat >> .env <<'BUCKET'
          $BUCKET_ENV
          BUCKET
          P=\$(grep '^COMPOSE_PROFILES=' .env | cut -d= -f2- || true)
          case ",\$P," in
            *,avendb,*) ;;
            *) sed -i '/^COMPOSE_PROFILES=/d' .env && echo "COMPOSE_PROFILES=\${P:+\$P,}avendb" >> .env ;;
          esac
          # Recheck the proposed settings too: a changed mount/bucket/seal cannot
          # activate a different device even after the old one closed cleanly.
          python3 "deploy/stop-avendb-$GITHUB_SHA.py" "$APP_DIR" --lock-fd 9 --verify-only
          # this one container: the API, the media vault and Caddy stay as they are
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps avendb
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          EOS
      - name: What the server says
        env:
          HAS_BUCKET: ${{ secrets.HETZNER_S3_ACCESS_KEY != '' && secrets.HETZNER_S3_SECRET_KEY != '' && secrets.AVENDB_BUCKET_SEAL != '' }}
        run: |
          # its device, its endpoint, whether a vault has claimed it, and its offer, all public (what the apps link through)
          # Replaying an existing cold store can exceed the old two-minute polling budget.
          # Allow 120 five-second polls before failing; the ready offer is still required.
          for i in $(seq 1 120); do
            SAID=$(ssh prod "docker logs maia-city-avendb 2>&1" | grep 'avenDB server:' || true)
            if printf '%s\n' "$SAID" | grep -q 'avenDB server: offer '; then printf '%s\n' "$SAID" | tail -4; break; fi
            if [ "$i" = 120 ]; then
              echo "::error::avenDB's server has not said its offer:"
              ssh prod "docker ps -a --filter name=^maia-city-avendb$; docker logs --tail 50 maia-city-avendb 2>&1"
              exit 1
            fi
            sleep 5
          done
          # where its store lives (blobs B3a), and whether its bucket takes what it puts there
          sleep 10
          SAID=$(ssh prod "docker logs maia-city-avendb 2>&1" | grep -E 'avenDB server: (its store|no bucket)|bucket' || true)
          printf '%s\n' "$SAID" | tail -6
          if printf '%s\n' "$SAID" | grep -q "the bucket can't be written"; then
            echo "::warning::avenDB's server can't write its bucket: it announces nothing new until it can"
          fi
          # on its volume it is another device, with another offer than the one the apps link through
          if [ "$HAS_BUCKET" = true ] && printf '%s\n' "$SAID" | grep -q 'avenDB server: no bucket'; then
            echo "::error::avenDB's server started without its bucket, though its settings are set: is AVENDB_BUCKET in its .env?"
            exit 1
          fi
          bash deploy/check-avendb.sh

  bucket:
    name: Make sure avenDB's bucket is there, locked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      # Hetzner takes no default CRC32 checksums: one only where S3 asks for it
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Make the bucket with Object Lock, or check the one there
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::No avenDB bucket: set HETZNER_S3_ACCESS_KEY and HETZNER_S3_SECRET_KEY."; exit 0
          fi
          s3() { aws s3api --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" --cli-connect-timeout 20 "$@"; }
          if SAID=$(s3 head-bucket --bucket "$BUCKET" 2>&1); then
            echo "$BUCKET is there"
          elif printf '%s' "$SAID" | grep -q '404\|Not Found\|NoSuchBucket'; then
            # Object Lock is chosen now or never
            s3 create-bucket --bucket "$BUCKET" --object-lock-enabled-for-bucket >/dev/null \
              || s3 create-bucket --bucket "$BUCKET" --object-lock-enabled-for-bucket \
                   --create-bucket-configuration "LocationConstraint=$S3_REGION" >/dev/null
            echo "$BUCKET is made, with Object Lock"
          else
            echo "::error::$BUCKET answers: $SAID (bucket names are unique across all of Hetzner: someone else's?)"; exit 1
          fi
          LOCK=$(s3 get-object-lock-configuration --bucket "$BUCKET" \
            --query 'ObjectLockConfiguration.ObjectLockEnabled' --output text 2>&1 || true)
          [ "$LOCK" = Enabled ] \
            || { echo "::error::$BUCKET has no Object Lock ($LOCK), and no bucket can get it later: make it anew"; exit 1; }
          # every new object version locked for 7 days, in compliance mode
          s3 put-object-lock-configuration --bucket "$BUCKET" --object-lock-configuration \
            '{"ObjectLockEnabled":"Enabled","Rule":{"DefaultRetention":{"Mode":"COMPLIANCE","Days":7}}}'
          s3 put-bucket-lifecycle-configuration --bucket "$BUCKET" --lifecycle-configuration '{"Rules":[
            {"ID":"replaced-7-days","Status":"Enabled","Filter":{"Prefix":""},"NoncurrentVersionExpiration":{"NoncurrentDays":7}},
            {"ID":"unfinished-2-days","Status":"Enabled","Filter":{"Prefix":""},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":2}}]}'
          echo "What $BUCKET says:"
          s3 get-bucket-versioning --bucket "$BUCKET" --output json
          s3 get-object-lock-configuration --bucket "$BUCKET" --output json
          s3 get-bucket-lifecycle-configuration --bucket "$BUCKET" --output json
      - name: Does the bucket's endpoint offer post-quantum TLS?
        run: |
          # avenDB's server offers X25519MLKEM768 alone; OpenSSL 3.5 (Alpine 3.22) offers it here too, and nothing else
          HOST=${S3_ENDPOINT#https://}
          SAID=$(docker run --rm alpine:3.22 sh -c "apk add -q openssl >/dev/null && \
            openssl s_client -connect $HOST:443 -servername $HOST -groups X25519MLKEM768 -brief </dev/null 2>&1" || true)
          printf '%s\n' "$SAID" | head -12
          if printf '%s' "$SAID" | grep -q 'group: X25519MLKEM768'; then
            echo "$HOST agrees X25519MLKEM768: the server can reach the bucket post-quantum only"
          else
            echo "::warning::$HOST did not agree X25519MLKEM768: the server reaches the bucket only if it also offers X25519"
          fi
