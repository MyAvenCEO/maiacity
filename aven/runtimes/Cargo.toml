# aven/runtimes' own Cargo workspace (README, "The package"): every runtime and what they share, with one lockfile and
# one build folder (target/, a volume in the box). The Lean spec sits beside them in spec/, outside the workspace. The
# repository's root workspace excludes this folder, as it excludes aven/DB2.
[workspace]
resolver = "3"
members = ["tree", "contract", "markdown", "face", "registry", "abi", "modules/markdown", "modules/face", "host"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# wasmi, built for debugging with its debug assertions, overflows a test thread's stack while it instantiates a module;
# in tests it builds as it ships
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmparser]
opt-level = 3
debug-assertions = false
overflow-checks = false
