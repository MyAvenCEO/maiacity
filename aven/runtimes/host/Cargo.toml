[package]
name = "aven-runtimes-host"
version = "0.0.0"
description = "The runtime host: loads a module only by a hash the manifest lists, admits it, and runs it under fuel (Aven.Runtime.Contract)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aven-core = { path = "../../DB2/core" }
aven-runtimes-contract = { path = "../contract" }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "deterministic"] }

[dev-dependencies]
serde_json = "=1.0.154"
aven-runtimes-markdown = { path = "../markdown" }
