# cargo-deny for avenDB's workspace (the supply-chain gate, step T7a of the tests and architecture audit): every crate
# avenDB links comes from crates.io or our own vendored iroh, carries a licence from the list below, and has no open
# RustSec advisory. Duplicate versions are reported, not refused, until step T7b brings each to one.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates with no safe upgrade, each pulled in by a dependency we keep. A vulnerability is never ignored here.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: through postcard, under iroh, iroh-blobs and loro" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps: through im, under loro" },
    { id = "RUSTSEC-2026-0248", reason = "im: under loro-internal" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks: through im, under loro" },
    { id = "RUSTSEC-2024-0436", reason = "paste: a build-time macro, under iroh's netlink" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: a build-time macro" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Our own crates are UNLICENSED and never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# path dependencies inside the workspace carry no version
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
