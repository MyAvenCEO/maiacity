# avenDB's own Cargo workspace (README, "Names"): every crate of avenDB, avenID and avenPEER, with one lockfile and one
# build folder (target/, a volume in the box). Each crate is its own folder (SANDBOX.md, "Layout"); the Lean specs sit
# beside them, outside the workspace. The repository's root workspace, v1's, excludes this folder.
[workspace]
resolver = "3"
members = ["core", "db/core", "db/docs", "store", "id/core", "peer/native", "peer/light"]
# The docs layer's fuzz targets are a workspace of their own (db/docs/fuzz), built only by cargo-fuzz.
exclude = ["db/docs/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Third-party crates build optimised, with line tables only (SANDBOX.md, "Open questions", 2): they come precompiled
# in the box's image, so it costs nothing in the loop, and the Peer-Light's wasm shrinks from 21.5 MB to 8 MB,
# wasm-bindgen from 2.7 s to 1.1 s and the workspace's tests from 15.6 s to 3.2 s. Our own crates stay at opt-level 0
# with full debug info.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"
