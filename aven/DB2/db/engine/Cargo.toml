[package]
name = "aven-db-engine"
version = "0.0.0"
description = "avenDB's ops engine, its pure core: queries over Records, mutations and their footprints, the change view and the reader's verdict on it (Aven.DB.Engine)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aven-core = { path = "../../core" }

[dev-dependencies]
proptest = "=1.12.0"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "unbounded_depth"] }
