# Apache OpenDAL's OPFS service (opendal-service-opfs 0.59.5, Apache-2.0: LICENSE and NOTICE here), forked so it runs
# in a worker as well as on a page: OpenDAL found OPFS through `window`, which a worker lacks (FORK.md). The workspace
# patches crates.io's crate with this one, so avenDB's store still uses OpenDAL's `services::Opfs`. Its own lockfile
# and workspace are avenDB's; its dependencies are pinned exactly at the versions avenDB's lock already holds.
[package]
name = "opendal-service-opfs"
version = "0.59.5"
edition = "2024"
rust-version = "1.91"
authors = ["Apache OpenDAL <dev@opendal.apache.org>"]
description = "Apache OpenDAL OPFS service implementation, forked by avenDB to run in workers"
license = "Apache-2.0"
repository = "https://github.com/apache/opendal"
readme = "README.md"
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
opendal-core = { version = "=0.59.5", default-features = false }
send_wrapper = "=0.6.0"
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
  "Blob",
  "console",
  "DomException",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "Navigator",
  "WriteCommandType",
  "WriteParams",
  "StorageManager",
  "Window",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }
