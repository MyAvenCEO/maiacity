# Aven.DB: avenDB's model in Lean (README, "How we work"). Core Lean only: the box has no network for Lean packages.
name = "aven-db-spec"
version = "0.1.0"
defaultTargets = ["Aven", "aven-db-model", "vectors"]

[[lean_lib]]
name = "Aven"
# Only Aven.DB is this package's: Aven.Core comes from the core package. Aven.Peer.Keeper is the Peers' (A45) and
# lives here until thread E's move makes peer/spec its package.
roots = ["Aven.DB", "Aven.Peer.Keeper", "Aven.Peer.Fetch"]

# The model runs (README, rule 10): replays traces given as JSON, so Rust's tests compare against it.
[[lean_exe]]
name = "aven-db-model"
root = "Main"

# The examples and generated cases as test vectors, committed in vectors/ (README, rule 10).
[[lean_exe]]
name = "vectors"
root = "Vectors"

# The shared core: Values, the codec, hashes, envelopes and logs (core/spec, ARCHITECTURE.md).
[[require]]
name = "aven-core-spec"
path = "../../core/spec"
