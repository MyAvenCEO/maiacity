[package]
name = "aven-store-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The store upgrade's spike (db/store/README.md, "The iroh it uses"): one file of chunk blobs and an index, moved from a
# Peer to a relay-only peer through the Aven Peer's relay, two ways. (a) iroh-blobs on our Store through an adapter;
# (b) bao-tree directly, with our own range requests. Thrown away once the decision is made.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for the wasm's size: keep only (a) or only (b) alive in a cdylib
wasm-a = []
wasm-b = []

[dependencies]
aven-db-store = { path = "../db/store" }
async-trait = "=0.1.92"
bao-tree = { version = "=0.17.0", default-features = false, features = ["experimental-mixed", "validate"] }
blake3 = "=1.8.7"
bytes = "=1.12.1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.104.0", default-features = false }
irpc = { version = "=0.17.0", default-features = false }
n0-future = "=0.3.2"
range-collections = "=0.4.6"
ref-cast = "=1.0.27"
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
