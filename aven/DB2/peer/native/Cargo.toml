[package]
name = "aven-peer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One core in two builds (README, "Two kinds of peer, one core"): the library is what every peer runs, the Peer-Light
# included (peer/light builds it without `native`); the binary is the Peer, and `--relay` makes it the Aven Peer.
[lib]
path = "src/lib.rs"

[[bin]]
name = "aven-peer"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:iroh-relay", "dep:rustls", "dep:tokio"]

[dependencies]
aven-core = { path = "../../core" }
aven-gen1 = { path = "../../gen1" }
aven-db-store = { path = "../../store" }
aven-id = { path = "../../id/core" }
# the file registry, aven/runtimes': what a file is by its bytes (at /runtimes in the box and the Peer's image)
aven-runtimes-registry = { path = "../../../runtimes/registry" }
bytes = "=1.12.1"
futures-channel = "=0.3.34"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
# the chat: members-only gossip on the shared Router, beside aven/db/1 (MILESTONE2.md, README rule 9)
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
n0-future = "=0.3.2"
serde_json = "=1.0.154"
iroh-relay = { version = "=1.4.1", features = ["server"], optional = true }
# the relay's QUIC address discovery serves TLS 1.3 with a certificate it is given (--relay-cert)
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "signal"], optional = true }

[dev-dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
sha2 = "=0.11.1"
