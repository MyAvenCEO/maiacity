[package]
name = "aven-peer-keeper"
version = "0.0.0"
description = "A keeper's arrivals for one Doc, pure: items by their sealed hash, numbered by arrival, covers by the uploader's own word, and catch-up by number (Aven.Peer.Keeper)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the gate's authority half: fetch keys, links, proofs and placement are avenCAPS' (aven_id::keep, Aven.ID.Keep)
aven-core = { path = "../../core" }
aven-id = { path = "../../id/core" }

[dev-dependencies]
# catching up end to end: a writer's sealed envelopes and segments through a keeper into a reader's Doc
aven-db-docs = { path = "../../db/docs" }
# signing with a fetch key in the gate tests, as aven-id pins it
ed25519-dalek = "=3.0.0"
serde_json = "=1.0.154"
