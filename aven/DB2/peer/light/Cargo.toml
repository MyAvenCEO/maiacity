[package]
name = "aven-peer-light"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The same core as the Peer (aven-peer without `native`), in a browser's worker: relay-only, since a browser can't
# send UDP.
[dependencies]
aven-peer = { path = "../native", default-features = false }
aven-core = { path = "../../core" }
aven-gen1 = { path = "../../gen1" }
aven-db-store = { path = "../../store" }
aven-id = { path = "../../id/core" }
# the file registry, aven/runtimes': what a file is by its bytes (at /runtimes in the box and the Peer's image)
aven-runtimes-registry = { path = "../../../runtimes/registry" }
futures-channel = "=0.3.34"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
js-sys = "=0.3.107"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
