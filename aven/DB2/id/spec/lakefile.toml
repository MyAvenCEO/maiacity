# Aven.ID, avenID's Lean model (aven/DB2/README.md, "Identity is a package of its own"). Core Lean only: the box has no
# network for Lean packages. `lake build` proves every theorem and checks every example; `aven-id-model` runs the
# model for aven-id's property tests, and `vectors` exports the examples and generated cases (README rule 10).
name = "aven-id-spec"
version = "0.1.0"
defaultTargets = ["AvenID", "aven-id-model", "vectors"]

[[lean_lib]]
name = "AvenID"
# Only Aven.ID is this package's: Aven.Core comes from its own package. avenID sits below docs and never requires it.
roots = ["Aven.ID"]

[[lean_exe]]
name = "aven-id-model"
root = "Main"

[[lean_exe]]
name = "vectors"
root = "Vectors"

# The shared core: Values, the codec, hashes, envelopes, targets and footprints (core/spec, ARCHITECTURE.md).
[[require]]
name = "aven-core-spec"
path = "../../core/spec"
