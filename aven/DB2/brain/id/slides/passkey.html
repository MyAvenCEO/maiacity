<figure class="slide passkey" role="img" aria-label="Alice's phone with a fingerprint on its screen. An arrow labelled unlocks runs to Alice's owner key.">
	<div class="drawn phone alice-phone">
		<div class="phone-body"></div>
		<div class="phone-screen"></div>
		<div class="print">
			<div class="ring ring-1"></div>
			<div class="ring ring-2"></div>
			<div class="ring ring-3"></div>
			<div class="ring ring-4"></div>
		</div>
	</div>
	<p class="label phone-label">Her passkey, on her phone</p>
	<div class="arrow unlock-arrow">
		<div class="arrow-line"></div>
		<div class="arrow-head"></div>
	</div>
	<p class="label relation unlock-label">unlocks</p>
	<div class="drawn key big">
		<div class="bow"></div>
		<div class="hole"></div>
		<div class="shaft"></div>
		<div class="bit bit-1"></div>
		<div class="bit bit-2"></div>
	</div>
	<p class="label key-label">Her owner key</p>
	<header class="title">
		<h2 class="headline">A passkey</h2>
	</header>
</figure>
