[package]
name = "aven-core"
version = "0.0.0"
description = "What every part of avenDB shares, in Rust: Values in the one codec, their names, signed things, envelopes, logs and the past (Aven.Core)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aven-codec = { path = "../codec" }

[dev-dependencies]
proptest = "=1.12.0"
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "unbounded_depth"] }
