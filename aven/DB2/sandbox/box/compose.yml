# avenSANDBOX's containers (aven/DB2/SANDBOX.md, "The box"). Only aven/DB2 is mounted, so nothing else of the
# repository is reachable inside the box. `bun run up` first builds the Peer and the Peer-Light's wasm once, into the
# shared build folder (the avensandbox_target volume); the Peers run that binary, and Vite serves that wasm. The S3
# server comes with the store.
name: avensandbox

x-peer: &peer
  image: ${AVENSANDBOX_IMAGE:?bun run up sets it}
  init: true
  restart: unless-stopped
  volumes:
    - target:/target:ro
    - events:/events
  networks: [wan]

services:
  # the Aven Peer: the Peer with its relay on. What ships is the node, never the box: the box is only its
  # configuration, the cast's test keys included, which `bun run up` derives (AVENSANDBOX_*)
  aven:
    <<: *peer
    command: ["/target/debug/aven-peer"]
    environment:
      AVEN_PEER_NAME: aven-peer
      AVEN_PEER_SECRET: ${AVENSANDBOX_AVEN_SECRET:?bun run up sets it}
      AVEN_PEER_RELAY: "true"
      AVEN_PEER_RELAY_URL: http://aven:3340
      AVEN_PEER_MEMBERS: ${AVENSANDBOX_MEMBERS:?bun run up sets it}
      AVEN_PEER_EVENTS: /events

  # Alice Peer: the same binary, relay off, direct to the Aven Peer over UDP
  alice:
    <<: *peer
    command: ["/target/debug/aven-peer"]
    environment:
      AVEN_PEER_NAME: alice-peer
      AVEN_PEER_SECRET: ${AVENSANDBOX_ALICE_SECRET:?bun run up sets it}
      AVEN_PEER_RELAY_URL: http://aven:3340
      AVEN_PEER_AVEN: aven:4433
      AVEN_PEER_AVEN_KEY: ${AVENSANDBOX_AVEN_KEY:?bun run up sets it}
      AVEN_PEER_MEMBERS: ${AVENSANDBOX_MEMBERS:?bun run up sets it}
      AVEN_PEER_EVENTS: /events
    depends_on: [aven]

  # Chromium with both Peer-Lights, and Vite serving avenOS, the Peer-Light's wasm and the relay's path
  browsers:
    image: ${AVENSANDBOX_IMAGE:?bun run up sets it}
    working_dir: /work
    command: ["node_modules/.bin/vite", "--config", "vite.config.js"]
    init: true
    shm_size: 1gb
    environment:
      AVENSANDBOX_RELAY: http://aven:3340
      AVENSANDBOX_EVENTS: /events
    volumes:
      - ../..:/work
      - node_modules:/work/node_modules
      - target:/work/target:ro
      - events:/events
    ports:
      - "${AVENSANDBOX_PORT:-5173}:5173"
    networks: [wan]

networks:
  wan: {}

volumes:
  # made by `bun run up`, which installs into it before the containers start
  node_modules:
    name: avensandbox_node_modules
    external: true
  # Rust's build folder, shared with `bun run box`
  target:
    name: avensandbox_target
    external: true
  # every peer's events as JSON lines, gathered into one timeline
  events:
    name: avensandbox_events
