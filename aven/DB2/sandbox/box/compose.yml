# avenSANDBOX's containers (aven/DB2/SANDBOX.md, "The box"). Only aven/DB2 is mounted, so nothing else of the
# repository is reachable inside the box. `bun run up` first builds the Peer and the Peer-Light's wasm once, into the
# shared build folder (the avensandbox_target volume); `aven` and `alice` run that binary, `browsers` serves avenOS and
# that wasm, and `s3` is the box's S3. Each peer keeps its data through avenDB's store: the Aven Peer in `s3`, Alice
# Peer in its volume `alice`, the Peer-Lights in their origins' OPFS, in the volume `chromium`. `down --wipe` empties
# them all.
name: avensandbox

x-peer: &peer
  image: ${AVENSANDBOX_IMAGE:?bun run up sets it}
  init: true
  restart: unless-stopped
  volumes:
    - target:/target:ro
    - events:/events
  networks: [wan]

services:
  # the Aven Peer: the Peer with its relay on. What ships is the node, never the box: the box is only its
  # configuration, the cast's test keys included, which `bun run up` derives (AVENSANDBOX_*)
  aven:
    <<: *peer
    command: ["/target/debug/aven-peer"]
    environment:
      AVEN_PEER_NAME: aven-peer
      AVEN_PEER_SECRET: ${AVENSANDBOX_AVEN_SECRET:?bun run up sets it}
      AVEN_PEER_RELAY: "true"
      AVEN_PEER_RELAY_URL: http://aven:3340
      AVEN_PEER_MEMBERS: ${AVENSANDBOX_MEMBERS:?bun run up sets it}
      AVEN_PEER_EVENTS: /events
      # it keeps its data in the box's S3, bucket aven, with the box's test credentials
      AVEN_PEER_STORE: s3
      AVEN_PEER_S3_ENDPOINT: http://s3:7070
      AVEN_PEER_S3_BUCKET: aven
      AVEN_PEER_S3_KEY: avensandbox
      AVEN_PEER_S3_SECRET: avensandbox-test-secret
    depends_on:
      s3: { condition: service_healthy }

  # Alice Peer: the same binary, relay off, direct to the Aven Peer over UDP
  alice:
    <<: *peer
    command: ["/target/debug/aven-peer"]
    environment:
      AVEN_PEER_NAME: alice-peer
      AVEN_PEER_SECRET: ${AVENSANDBOX_ALICE_SECRET:?bun run up sets it}
      AVEN_PEER_RELAY_URL: http://aven:3340
      AVEN_PEER_AVEN: aven:4433
      AVEN_PEER_AVEN_KEY: ${AVENSANDBOX_AVEN_KEY:?bun run up sets it}
      AVEN_PEER_MEMBERS: ${AVENSANDBOX_MEMBERS:?bun run up sets it}
      AVEN_PEER_EVENTS: /events
      # it keeps its data in a folder, in its own volume
      AVEN_PEER_STORE: fs
      AVEN_PEER_STORE_PATH: /data
    volumes:
      - target:/target:ro
      - events:/events
      - alice:/data
    depends_on: [aven]

  # Production's stand-in (PRODUCTION.md, "How it is checked"): an Aven Peer in production's configuration. No cast:
  # its tree is kept in the box's S3 under a root of its own, claimed by the first passkey to sign up, made
  # for `localhost` on avenOS at http://localhost:5174 (sandbox/prod.mjs). No members: anyone may connect, as in
  # production until milestone 2's invites
  prod:
    <<: *peer
    command: ["/target/debug/aven-peer"]
    environment:
      AVEN_PEER_NAME: prod-peer
      AVEN_PEER_SECRET: ${AVENSANDBOX_PROD_SECRET:?bun run up sets it}
      AVEN_PEER_RELAY: "true"
      AVEN_PEER_RELAY_URL: http://prod:3340
      AVEN_PEER_EVENTS: /events
      AVEN_PEER_STORE: s3
      AVEN_PEER_S3_ENDPOINT: http://s3:7070
      AVEN_PEER_S3_BUCKET: aven
      AVEN_PEER_S3_ROOT: /prod/
      AVEN_PEER_S3_KEY: avensandbox
      AVEN_PEER_S3_SECRET: avensandbox-test-secret
      AVEN_PEER_GUARDIAN: ${AVENSANDBOX_GUARDIAN:?bun run up sets it}
      AVEN_PEER_RP_ID: localhost
      AVEN_PEER_ORIGIN: http://localhost:5174
    depends_on:
      s3: { condition: service_healthy }

  # Chromium with both Peer-Lights, and Vite serving avenOS, the Peer-Light's wasm and the relay's path
  browsers:
    image: ${AVENSANDBOX_IMAGE:?bun run up sets it}
    working_dir: /work
    command: ["node_modules/.bin/vite", "--config", "vite.config.js"]
    init: true
    shm_size: 1gb
    environment:
      AVENSANDBOX_RELAY: http://aven:3340
      AVENSANDBOX_EVENTS: /events
      AVENSANDBOX_PROD_RELAY: http://prod:3340
      AVENSANDBOX_PROD_KEY: ${AVENSANDBOX_PROD_KEY:?bun run up sets it}
      AVENSANDBOX_GUARDIAN: ${AVENSANDBOX_GUARDIAN:?bun run up sets it}
    volumes:
      - ../..:/work
      - node_modules:/work/node_modules
      - target:/work/target:ro
      - events:/events
      # the check's Chromium profile, so each Peer-Light's OPFS outlives a check; `down --wipe` empties it
      - chromium:/profile
    ports:
      - "${AVENSANDBOX_PORT:-5173}:5173"
      - "${AVENSANDBOX_PROD_PORT:-5174}:5174"
    networks: [wan]

  # The box's S3 (SANDBOX.md, "Storage"): versitygw, shipped in the box's own image, over a folder in its own volume,
  # never a real cloud bucket. At http://s3:7070 on `wan`, and at 127.0.0.1:7070 for the box's commands, which run on
  # the host's network in a cloud session. Test credentials, valid only in the box; the store's tests use the bucket
  # aven-db-store, the Aven Peer keeps its data in aven. `down --wipe` empties it.
  s3:
    image: ${AVENSANDBOX_IMAGE:?bun run up sets it}
    entrypoint: ["sh", "-c", "mkdir -p /data/aven /data/aven-db-store && exec versitygw --port :7070 posix /data"]
    environment:
      ROOT_ACCESS_KEY: avensandbox
      ROOT_SECRET_KEY: avensandbox-test-secret
    init: true
    volumes:
      - s3:/data
    ports:
      - "127.0.0.1:7070:7070"
    networks: [wan]
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:7070/"]
      interval: 2s
      retries: 15

networks:
  wan: {}

volumes:
  s3: {}
  # Alice Peer's store
  alice: {}
  chromium: {}
  # made by `bun run up`, which installs into it before the containers start
  node_modules:
    name: avensandbox_node_modules
    external: true
  # Rust's build folder, shared with `bun run box`
  target:
    name: avensandbox_target
    external: true
  # every peer's events as JSON lines, gathered into one timeline
  events:
    name: avensandbox_events
