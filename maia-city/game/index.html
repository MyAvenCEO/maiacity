<!doctype html>
<!--
	MaiaCity Game: the Resource Library. Every base resource of the world, before anything is made from it
	(./resources.js), drawn by code (./pixels.js) and shown by ./library.js. Plain HTML and JavaScript, no build, no
	dependencies: `bun run dev` in this folder serves it.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>MaiaCity Resource Library</title>
		<meta name="description" content="The base resources of the MaiaCity game, drawn at 16 × 16 pixels." />
		<style>
			:root {
				color-scheme: light;
				--bg: #f4f1e9;
				--surface: #fffdf8;
				--surface-2: #ece7db;
				--stage-1: #faf7f0;
				--stage-2: #e9e3d4;
				--ink: #23241f;
				--muted: #6e6c62;
				--line: #e0d9c8;
				--accent: #4f7f5e;
				--shadow: 0 1px 2px rgb(50 40 20 / 0.06), 0 8px 24px rgb(50 40 20 / 0.06);
				--lift: 0 2px 4px rgb(50 40 20 / 0.08), 0 14px 32px rgb(50 40 20 / 0.12);
				--icon-shadow: drop-shadow(0 5px 4px rgb(40 30 10 / 0.22));
				--scrim: rgb(20 18 12 / 0.35);
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) {
					color-scheme: dark;
					--bg: #131512;
					--surface: #1c1f1b;
					--surface-2: #262a25;
					--stage-1: #262a25;
					--stage-2: #191c18;
					--ink: #ecebe4;
					--muted: #a3a197;
					--line: #2f332e;
					--accent: #85b694;
					--shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
					--lift: 0 2px 4px rgb(0 0 0 / 0.35), 0 14px 32px rgb(0 0 0 / 0.4);
					--icon-shadow: drop-shadow(0 5px 4px rgb(0 0 0 / 0.5));
					--scrim: rgb(0 0 0 / 0.55);
				}
			}
			:root[data-theme='dark'] {
				color-scheme: dark;
				--bg: #131512;
				--surface: #1c1f1b;
				--surface-2: #262a25;
				--stage-1: #262a25;
				--stage-2: #191c18;
				--ink: #ecebe4;
				--muted: #a3a197;
				--line: #2f332e;
				--accent: #85b694;
				--shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
				--lift: 0 2px 4px rgb(0 0 0 / 0.35), 0 14px 32px rgb(0 0 0 / 0.4);
				--icon-shadow: drop-shadow(0 5px 4px rgb(0 0 0 / 0.5));
				--scrim: rgb(0 0 0 / 0.55);
			}

			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				overflow-x: hidden;
			}
			button {
				font: inherit;
				color: inherit;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: 0 16px;
			}

			.top {
				padding-top: 40px;
				padding-bottom: 20px;
			}
			.brand {
				margin: 0 0 6px;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--accent);
			}
			h1 {
				margin: 0;
				font-size: clamp(28px, 5vw, 40px);
				line-height: 1.1;
				letter-spacing: -0.02em;
			}
			#lede {
				max-width: 60ch;
				margin: 10px 0 0;
				color: var(--muted);
			}

			.bar {
				position: sticky;
				top: 0;
				z-index: 5;
				padding: 12px 0;
				background: color-mix(in srgb, var(--bg) 88%, transparent);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				border-bottom: 1px solid var(--line);
			}
			.bar .wrap {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
			}
			.find {
				position: relative;
				flex: 1 1 220px;
				max-width: 340px;
			}
			.find svg {
				position: absolute;
				left: 12px;
				top: 50%;
				translate: 0 -50%;
				color: var(--muted);
			}
			#search {
				width: 100%;
				height: 38px;
				padding: 0 12px 0 36px;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--surface);
				color: var(--ink);
				font: inherit;
			}
			#search::placeholder {
				color: var(--muted);
			}
			#tally {
				margin-left: auto;
				font-size: 13px;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			#groups {
				display: flex;
				gap: 6px;
				flex: 1 1 100%;
				overflow-x: auto;
				scrollbar-width: none;
				margin: 0 -16px;
				padding: 0 16px;
			}
			#groups::-webkit-scrollbar {
				display: none;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				flex: none;
				height: 32px;
				padding: 0 12px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: var(--surface);
				font-size: 13px;
				font-weight: 500;
				cursor: pointer;
			}
			.chip .n {
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			.chip[aria-pressed='true'] {
				background: var(--ink);
				border-color: var(--ink);
				color: var(--bg);
			}
			.chip[aria-pressed='true'] .n {
				color: inherit;
				opacity: 0.7;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--group, var(--accent));
				flex: none;
			}

			#library {
				padding-top: 8px;
				padding-bottom: 64px;
			}
			.group {
				padding-top: 28px;
			}
			.group header {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 4px 14px;
				margin-bottom: 14px;
			}
			.group h2 {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 0;
				font-size: 19px;
				letter-spacing: -0.01em;
			}
			.group h2 .n {
				font-size: 12px;
				font-weight: 600;
				padding: 1px 8px;
				border-radius: 999px;
				background: var(--surface-2);
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			.group header p {
				margin: 0;
				color: var(--muted);
				font-size: 14px;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
				gap: 12px;
			}
			.card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
				padding: 10px 8px 12px;
				border: 1px solid var(--line);
				border-radius: 14px;
				background: var(--surface);
				box-shadow: var(--shadow);
				text-align: center;
				cursor: pointer;
				transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
			}
			.card:hover {
				transform: translateY(-2px);
				box-shadow: var(--lift);
				border-color: color-mix(in srgb, var(--group) 55%, var(--line));
			}
			.card[aria-current] {
				border-color: var(--group);
				box-shadow: 0 0 0 1px var(--group), var(--lift);
			}
			.card[hidden],
			.group[hidden] {
				display: none;
			}
			.stage {
				display: grid;
				place-items: center;
				width: 100%;
				aspect-ratio: 4 / 3;
				margin-bottom: 6px;
				border-radius: 10px;
				background: radial-gradient(ellipse at 50% 40%, var(--stage-1), var(--stage-2));
			}
			.icon {
				display: block;
				image-rendering: pixelated;
				filter: var(--icon-shadow);
			}
			.name {
				font-size: 14px;
				font-weight: 600;
				line-height: 1.25;
			}
			.kind {
				font-size: 11px;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.empty,
			.needs-server {
				padding: 48px 0;
				color: var(--muted);
				text-align: center;
			}
			code {
				font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
				padding: 1px 5px;
				border-radius: 5px;
				background: var(--surface-2);
			}

			#scrim {
				position: fixed;
				inset: 0;
				z-index: 9;
				background: var(--scrim);
			}
			#detail {
				position: fixed;
				z-index: 10;
				top: 12px;
				right: 12px;
				bottom: 12px;
				width: min(380px, calc(100vw - 24px));
				overflow-y: auto;
				padding: 20px 22px 24px;
				border: 1px solid var(--line);
				border-radius: 18px;
				background: var(--surface);
				box-shadow: var(--lift);
				animation: slide 0.2s ease;
			}
			#detail[hidden],
			#scrim[hidden] {
				display: none;
			}
			@keyframes slide {
				from {
					opacity: 0;
					transform: translateX(16px);
				}
			}
			.close {
				position: absolute;
				top: 12px;
				right: 12px;
				width: 34px;
				height: 34px;
				border: 0;
				border-radius: 50%;
				background: var(--surface-2);
				font-size: 20px;
				line-height: 1;
				cursor: pointer;
			}
			.hero {
				display: grid;
				place-items: center;
				height: 210px;
				margin: 4px 0 18px;
				border-radius: 14px;
				background:
					radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--group) 14%, var(--stage-1)), var(--stage-2));
			}
			.eyebrow {
				display: flex;
				align-items: center;
				gap: 6px;
				margin: 0;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			#detail h2 {
				margin: 4px 0 6px;
				font-size: 26px;
				letter-spacing: -0.02em;
			}
			.note {
				margin: 0 0 16px;
			}
			dl {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 8px 16px;
				margin: 0;
				padding: 14px 0;
				border-top: 1px solid var(--line);
				border-bottom: 1px solid var(--line);
				font-size: 14px;
			}
			dt {
				color: var(--muted);
			}
			dd {
				margin: 0;
			}
			.tiles p {
				margin: 16px 0 8px;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.tiles > div {
				display: flex;
				gap: 14px;
			}
			.tiles figure {
				margin: 0;
				text-align: center;
				font-size: 12px;
				color: var(--muted);
			}
			.tile {
				display: block;
				width: 80px;
				height: 80px;
				margin-bottom: 4px;
				image-rendering: pixelated;
				border-radius: 6px;
				background:
					repeating-conic-gradient(var(--surface-2) 0 25%, transparent 0 50%) 0 0 / 10px 10px;
				outline: 1px solid var(--line);
			}

			@media (max-width: 640px) {
				.top {
					padding-top: 28px;
				}
				.grid {
					grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
					gap: 8px;
				}
				.find {
					max-width: none;
				}
				#detail {
					top: auto;
					left: 0;
					right: 0;
					bottom: 0;
					width: auto;
					max-height: 82vh;
					border-radius: 18px 18px 0 0;
					animation-name: rise;
				}
				@keyframes rise {
					from {
						opacity: 0;
						transform: translateY(24px);
					}
				}
				.hero {
					height: 180px;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.card,
				#detail {
					transition: none;
					animation: none;
				}
			}
		</style>
		<script type="module" src="./library.js"></script>
	</head>
	<body>
		<header class="top wrap">
			<p class="brand">maiaCITY · Game</p>
			<h1>Resource Library</h1>
			<p id="lede">Everything the world gives before anything is made from it.</p>
		</header>

		<div class="bar">
			<div class="wrap">
				<label class="find">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
						<circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6" />
						<path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
					</svg>
					<input id="search" type="search" placeholder="Search resources" aria-label="Search resources" autocomplete="off" />
				</label>
				<span id="tally" aria-live="polite"></span>
				<nav id="groups" aria-label="Groups"></nav>
			</div>
		</div>

		<main id="library" class="wrap">
			<p class="needs-server" id="needs-server">
				This page loads its code as modules, which a browser won't do from a file. Run <code>bun run dev</code> in
				<code>maia-city/game</code> and open the address it prints.
			</p>
		</main>

		<div id="scrim" hidden></div>
		<aside id="detail" hidden></aside>
	</body>
</html>
