[package]
name = "vault-asr"
version = "0.1.0"
description = "Speech to text on the Mac, on-device: NVIDIA Nemotron 3.5 ASR streaming (0.6B, ONNX) through parakeet-rs, Silero VAD — the words of every recording, with their times, never leaving our devices"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
