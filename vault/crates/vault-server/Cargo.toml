[package]
name = "vault-server"
version = "0.1.0"
description = "The vault's always-on peer on the Hetzner server: catalog replica, content in Object Storage, relay, HTTP gateway"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault-server"
path = "src/main.rs"

[dependencies]
vault-color = { path = "../vault-color" }
iroh.workspace = true
noq-proto.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
iroh-gossip.workspace = true
iroh-relay = { version = "=1.3.0", features = ["server"] }
bao-tree = "0.16"
blake3.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-lite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
bytes = "1"
url = "2"
hex = "0.4"
sha2 = "0.10"
rusty-s3 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
