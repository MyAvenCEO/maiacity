[package]
name = "vault-render"
version = "0.1.0"
description = "The final film render, native on the Mac: Core Image on Metal, AVFoundation, Core Text — the render worker without bun or ffmpeg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vault-media = { path = "../vault-media" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-image = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
