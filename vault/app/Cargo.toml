[package]
name = "maiacity-studio"
version = "0.1.0"
description = "maiaCITY Studio — the Mac app: the media vault, ingest, and every admin and studio function, native"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
vault-core = { path = "../crates/vault-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
iroh.workspace = true
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
trash = "5"
futures-lite.workspace = true
schemars = "1"
vault-media = { path = "../crates/vault-media" }
# speech to text, on-device: Nemotron 3.5 through parakeet-rs and ONNX Runtime (transcripts.rs)
vault-asr = { path = "../crates/vault-asr" }
# the final film render, natively (render.rs: the app is the render worker)
vault-render = { path = "../crates/vault-render" }
# the world window's WKWebView and NSWindow, and App Nap (world.rs)
objc2 = "0.6"
objc2-foundation = "0.3"
# native-tls = the macOS Security framework, like the Keychain
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset"] }
security-framework = "3.7"

[features]
# The app's own pages, embedded (build/): what `tauri build` turns on. Without it the window loads the dev server
# (devUrl, localhost:5173) — a white window when none runs. Build with `cargo build --release --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
