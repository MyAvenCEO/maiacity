# `tauri dev` runs the app unbundled, and the Dock names an unbundled app after its binary (maiacity-studio). A
# Cargo binary can't be called "The OS" (no spaces), so on a Mac `cargo run` starts it through a hard link named so.
[target.'cfg(target_os = "macos")']
runner = "scripts/run-as-the-os.sh"
