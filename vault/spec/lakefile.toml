name = "vault-spec"
version = "0.1.0"
defaultTargets = ["VaultSpec", "VectorsCheck"]

[[lean_lib]]
name = "VaultSpec"

# `lake exe vectors` writes vectors/vaults.json and vectors/lenses.json, the cases the Rust core replays (vault-db/tests)
[[lean_exe]]
name = "vectors"
root = "WriteVectors"

# `lake build` checks the files against the model, again whenever a file or the rules change
[[lean_lib]]
name = "VectorsCheck"
needs = ["vaults-json", "lenses-json"]

[[input_file]]
name = "vaults-json"
path = "vectors/vaults.json"
text = true

[[input_file]]
name = "lenses-json"
path = "vectors/lenses.json"
text = true
