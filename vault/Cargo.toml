# theOS, the Mac app (app/), and its native media crates: colour, pictures and sound, speech, the render. Its files are
# avenDB's (avendb/, linked by path); the old iroh media vault and its crates retired (#1112).
[workspace]
resolver = "3"
members = ["crates/vault-color", "crates/vault-media", "crates/vault-asr", "crates/vault-render", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
blake3 = { version = "1.8", features = ["rayon"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# No LTO: the heavy work runs in Apple's frameworks (Metal, Core Image, VideoToolbox) and iroh, not in our own code,
# and cross-crate optimisation at link time cost minutes on every build of the app for little.
[profile.release]
lto = false
# theOS's own update (a release build on the Mac at every main) compiles again only what changed in our crates and
# avenDB's: without it each update compiled the app and avenDB's crates whole, 2 to 6 minutes on the Mac. The
# dependencies are never incremental.
incremental = true

# Debug builds: line tables for our code (backtraces keep their lines), none for the dependencies — much smaller
# objects, faster links; the dependencies optimised, so a debug app against the dev server (Svelte changes live, no
# release build) still measures 4K pictures and runs iroh at a usable speed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# Our own picture crates optimised too: the player builds the grade's 129³ output cube in them, 0.6 s at opt-level 0
# and 18 ms at 2, and at 0 that alone stalled playback for a second at a time
[profile.dev.package.vault-render]
opt-level = 2

[profile.dev.package.vault-color]
opt-level = 2

[profile.dev.package.vault-media]
opt-level = 2

# avenDB's device, built into the app (avendb.rs): Classic McEliece makes a key pair in about 0.6 s at opt-level 3
# and twice that at 2 (avendb/Cargo.toml)
[profile.dev.package.classic-mceliece-rust]
opt-level = 3

# The in-process avenDB node must use the same late custom-path activation fix as the avenDB workspace.
[patch.crates-io]
iroh = { path = "../avendb/vendor/iroh" }
