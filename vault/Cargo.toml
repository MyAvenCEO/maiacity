# The media vault: every file known by its BLAKE3 hash, kept and moved by iroh.
# See .claude/skills/iroh/ — maiacity.md for the design, gotchas.md for why the iroh versions are pinned exactly.
[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/vault-media", "crates/vault-render", "crates/vault-server", "crates/vault-cli", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# iroh-blobs is pre-1.0 ("not yet production quality"): pinned exactly, upgraded on purpose
iroh = "=1.3.0"
# iroh's QUIC; only for its congestion controllers (BBR), as iroh's own docs pair them with QuicTransportConfig
noq-proto = { version = "=1.3.0", default-features = false }
iroh-blobs = "=0.103.0"
iroh-docs = "=0.101.0"
iroh-gossip = "=0.101.0"
blake3 = { version = "1.8", features = ["rayon"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
