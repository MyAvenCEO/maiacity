# The media vault: every file known by its BLAKE3 hash, kept and moved by iroh.
# See .claude/skills/iroh/ — maiacity.md for the design, gotchas.md for why the iroh versions are pinned exactly.
[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/vault-color", "crates/vault-media", "crates/vault-asr", "crates/vault-render", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# iroh-blobs is pre-1.0 ("not yet production quality"): pinned exactly, upgraded on purpose
# no default features: each crate names its TLS (vault-core: ring by default, aws-lc-rs in the Mac app beside avenDB)
iroh = { version = "=1.3.0", default-features = false }
# iroh's QUIC; only for its congestion controllers (BBR), as iroh's own docs pair them with QuicTransportConfig
noq-proto = { version = "=1.3.0", default-features = false }
iroh-blobs = "=0.103.1"
iroh-docs = "=0.101.0"
iroh-gossip = "=0.101.0"
blake3 = { version = "1.8", features = ["rayon"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# No LTO: the heavy work runs in Apple's frameworks (Metal, Core Image, VideoToolbox) and iroh, not in our own code,
# and cross-crate optimisation at link time cost minutes on every build of the app for little.
[profile.release]
lto = false

# Debug builds: line tables for our code (backtraces keep their lines), none for the dependencies — much smaller
# objects, faster links; the dependencies optimised, so a debug app against the dev server (Svelte changes live, no
# release build) still measures 4K pictures and runs iroh at a usable speed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# Our own picture crates optimised too: the player builds the grade's 129³ output cube in them, 0.6 s at opt-level 0
# and 18 ms at 2, and at 0 that alone stalled playback for a second at a time
[profile.dev.package.vault-render]
opt-level = 2

[profile.dev.package.vault-color]
opt-level = 2

[profile.dev.package.vault-media]
opt-level = 2

# avenDB's device, built into the app (avendb.rs): Classic McEliece makes a key pair in about 0.6 s at opt-level 3
# and twice that at 2 (avendb/Cargo.toml)
[profile.dev.package.classic-mceliece-rust]
opt-level = 3
